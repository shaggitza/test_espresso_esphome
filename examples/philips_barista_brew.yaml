# =============================================================================
# ESPHome Espresso Machine Controller — Reference Device Configuration
# Target machine: Philips Barista Brew (integrated grinder, single thermoblock)
#
# HOW TO USE:
#   1. Copy this file to your ESPHome config directory.
#   2. Update every "# ← CHANGE ME" comment to match your wiring.
#   3. Create a secrets.yaml alongside this file with your Wi-Fi credentials.
#   4. Run:  esphome run philips_barista_brew.yaml
#
# IMPLEMENTATION STATUS (see FEATURES.md for the full list):
#   ✅ Implemented:  flow meter, valves (with interlock), pump, grinder, pre-infusion,
#                    brew auto-termination at flow_max, PID climate (native ESPHome),
#                    brew_start / brew_stop / steam_start / steam_stop actions,
#                    steam temperature-gating (IHeater), purge-before-steam (purge_volume),
#                    steam safety timeout, post-steam cool-down + purge sequence,
#                    steam pump 2s minimum on-window (P2-7), cleanup_script callbacks (P2-1),
#                    espresso_machine.flush action (P2-2)
#   🚧 Partial:      temperature surfing (config accepted; ramp applies via IHeater),
#                    hard over-temperature cutoff (C++ + on_value_range)
#   ⬜ Not yet:      grinder lockout, brew profiles
#
# DESIGN PHILOSOPHY:
#   Every subsystem (heater, valves, pump, grinder, flow meter) is a first-class
#   ESPHome entity defined at the top level with its own platform block.
#   The espresso_machine: block is a pure orchestrator — it only references those
#   entities by id: and manages the brew / steam state machines.
#   This lets you use any entity independently from HA or ESPHome scripts.
#
# SAFETY WARNING:
#   This configuration controls the LOW-VOLTAGE side of your machine only.
#   The 220 V heater, pump and grinder are switched via SSRs/relays already
#   present in your machine. Never bypass galvanic isolation.
# =============================================================================

# -----------------------------------------------------------------------------
# ESPHome core
# -----------------------------------------------------------------------------
esphome:
  name: philips_barista_brew
  friendly_name: "Philips Barista Brew"
  comment: "ESPHome espresso machine controller — github.com/shaggitza/test_espresso_esphome"

esp32:
  board: esp32dev        # ← CHANGE ME if using a different board variant
  framework:
    type: arduino

# -----------------------------------------------------------------------------
# Logging (reduce verbosity in production to save log bandwidth)
# -----------------------------------------------------------------------------
logger:
  level: INFO

# -----------------------------------------------------------------------------
# Home Assistant API
# -----------------------------------------------------------------------------
api:
  encryption:
    key: !secret ha_api_key    # generate with: esphome generate-api-key

# -----------------------------------------------------------------------------
# OTA updates
# -----------------------------------------------------------------------------
ota:
  - platform: esphome
    password: !secret ota_password

# -----------------------------------------------------------------------------
# Wi-Fi
# -----------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional: static IP for stable HA discovery
  # manual_ip:
  #   static_ip: 192.168.1.100
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

# -----------------------------------------------------------------------------
# External components — pulls all espresso_machine platforms from this repo
# -----------------------------------------------------------------------------
external_components:
  - source: github://shaggitza/test_espresso_esphome@main
    components:
      - espresso_machine           # orchestrator: brew + steam state machines
      - espresso_machine_heater    # IHeater adapter wrapping climate.pid (P1-1)
      - espresso_machine_valve     # solenoid valve with safety interlock
      - espresso_machine_pump      # vibration pump (relay or dimmer)
      - espresso_machine_grinder   # timed relay grinder with lockout
      - espresso_machine_flow_meter  # pulse-counting volumetric sensor

# -----------------------------------------------------------------------------
# SPI bus — used by the MAX6675/MAX31855 thermocouple board
# -----------------------------------------------------------------------------
spi:
  clk_pin: GPIO18     # ← CHANGE ME
  miso_pin: GPIO19    # ← CHANGE ME

# -----------------------------------------------------------------------------
# I2C bus — used by the optional OLED display
# -----------------------------------------------------------------------------
i2c:
  sda: GPIO21         # ← CHANGE ME (or remove this block if no display)
  scl: GPIO22         # ← CHANGE ME

# =============================================================================
# TEMPERATURE SENSOR — native ESPHome sensor (first-class citizen)
# The thermoblock surface temperature, read by a thermocouple board via SPI.
# Visible in HA as a sensor entity. Can be used independently in automations.
#
# SUPPORTED THERMOCOUPLE INTERFACES — choose ONE of the three options below:
#
#  Option A — MAX6675 (most common, K-type only, single fault bit, ±1.5 °C)
#    Pros:  cheap, widely available, simple
#    Cons:  K-type only, no cold-junction compensation accuracy, no open-wire detail
#
#  Option B — MAX31855 (better, K-type only, full fault diagnostics, ±2 °C)
#    Pros:  open/short-to-GND/VCC fault codes, readable cold-junction temp
#    Cons:  slightly more expensive; K-type only
#
#  Option C — NTC thermistor (no SPI, single analog pin, ±1 °C)
#    Pros:  no SPI bus needed, very cheap
#    Cons:  shorter range (~150 °C max), needs calibration, less accurate at high temp
#    Use:   replace the SPI block above with an ADC-based sensor using a voltage divider.
#
# Recommendation: MAX31855 for new builds (better fault reporting); MAX6675 if already
# sourced. Only use NTC if SPI pins are unavailable.
# =============================================================================
sensor:
  # ---------- Option A: MAX6675 (active — comment out to switch) ----------
  - platform: max6675
    id: thermoblock_temp
    name: "Thermoblock Temperature"
    cs_pin: GPIO5             # ← CHANGE ME — SPI chip-select for thermocouple board
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    # Safety: hard over-temperature cutoff — independent of PID.
    # If the thermoblock exceeds this limit the heater is forced OFF immediately.
    # Tune OVER_TEMP_CUTOFF to ~30 °C above your highest normal setpoint.
    on_value_range:
      - above: 165            # °C — absolute maximum; adjust to your machine's rating
        then:
          - climate.control:
              id: main_heater
              mode: "off"
          - logger.log:
              format: "SAFETY: Over-temperature cutoff (%.1f °C). Heater forced OFF."
              args: ["x"]
              level: ERROR

  # ---------- Option B: MAX31855 (comment out Option A and uncomment this) ----------
  # - platform: max31855
  #   id: thermoblock_temp
  #   name: "Thermoblock Temperature"
  #   cs_pin: GPIO5             # ← CHANGE ME
  #   update_interval: 1s
  #   filters:
  #     - sliding_window_moving_average:
  #         window_size: 5
  #         send_every: 1
  #   on_value_range:
  #     - above: 165
  #       then:
  #         - climate.control:
  #             id: main_heater
  #             mode: "off"
  #         - logger.log:
  #             format: "SAFETY: Over-temperature cutoff (%.1f °C). Heater forced OFF."
  #             args: ["x"]
  #             level: ERROR

  # ---------- Option C: NTC thermistor (no SPI; comment out Options A & B) ----------
  # Remove the spi: block above if using only NTC.
  # - platform: ntc
  #   id: thermoblock_temp
  #   name: "Thermoblock Temperature"
  #   sensor: ntc_adc_raw      # reference to an adc sensor on the same pin
  #   calibration:
  #     b_constant: 3950
  #     reference_temperature: 25°C
  #     reference_resistance: 10kOhm
  #   on_value_range:
  #     - above: 165
  #       then:
  #         - climate.control:
  #             id: main_heater
  #             mode: "off"
  #         - logger.log:
  #             format: "SAFETY: Over-temperature cutoff (%.1f °C). Heater forced OFF."
  #             args: ["x"]
  #             level: ERROR
  # # ADC helper for NTC option (add this when using Option C):
  # - platform: adc
  #   id: ntc_adc_raw
  #   pin: GPIO35               # ← CHANGE ME — analog-capable pin (GPIO32–GPIO39 on ESP32)
  #   update_interval: 1s
  #   attenuation: 11db         # for 3.3 V full-scale range

  # Diagnostic sensors (standard ESPHome platforms)
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: internal_temperature
    name: "ESP32 Temperature"
    entity_category: diagnostic

  # NOTE: Shot statistics (last shot time, volume, yield) are now declared
  # natively under espresso_machine: brew: shot_stats: (P1-5).
  # Remove the template sensor blocks below if upgrading from an older config.

# =============================================================================
# FLOW METER — espresso_machine_flow_meter platform (first-class citizen)
# Pulse-counting volumetric sensor. Visible in HA as two sensor entities:
#   • "Brew Flow Rate"  — instantaneous flow rate (ml/s)
#   • "Brew Flow Total" — accumulated volume this shot (ml)
# Can be reset independently via the espresso_machine_flow_meter.reset action.
# =============================================================================
espresso_machine_flow_meter:
  id: brew_flow
  name: "Brew Flow"
  pin:
    number: GPIO34            # ← CHANGE ME (input-capable GPIO; GPIO34–39 on ESP32)
    mode: INPUT_PULLDOWN
  pulses_per_ml: 0.5195       # ← calibrate for your flow meter (AB32: ~0.5195)
  rate_sensor:
    name: "Brew Flow Rate"    # ml/s — appears in HA as sensor entity
  total_sensor:
    name: "Brew Flow Total"   # mL accumulated this shot — appears in HA as sensor entity

# =============================================================================
# HEATER OUTPUT — native ESPHome output driving the SSR
# The SSR defaults to OFF (GPIO LOW) on reset — safe by design.
#
# SUPPORTED OUTPUT TYPES — choose ONE:
#
#  Option A — slow_pwm (recommended for SSR + thermoblock)
#    Period 1 s gives the PID fine-grained duty-cycle control (0–100 %).
#    SSRs switch silently and handle 1 Hz PWM with zero wear.
#    Shorter period = finer control but higher SSR switching stress.
#
#  Option B — gpio (on/off bang-bang, no duty-cycle)
#    Use only if you do NOT use a PID climate — pair with thermostat climate instead.
#    Loses the proportional benefit of PID; temperature will oscillate ±1–2 °C.
#
#  Option C — ledc (hardware PWM ~1 kHz, for resistive loads only)
#    Not recommended for SSRs — most SSRs have a minimum turn-on pulse width > 1 ms.
#    Only use if your SSR explicitly supports high-frequency switching.
# =============================================================================
output:
  # ---------- Option A: slow_pwm (active) ----------
  - platform: slow_pwm
    id: heater_ssr
    pin: GPIO4                # ← CHANGE ME — GPIO to SSR control input
    period: 1s                # 1 s gives good PID resolution; increase to 2 s for less stress

  # ---------- Option B: gpio / bang-bang (comment out Option A and uncomment) ----------
  # - platform: gpio
  #   id: heater_ssr
  #   pin: GPIO4              # ← CHANGE ME
  # # When using gpio output, replace climate.pid below with climate.thermostat:
  # # climate:
  # #   - platform: thermostat
  # #     id: main_heater
  # #     sensor: thermoblock_temp
  # #     heat_deadband: 0.5°C     # hysteresis — tune to taste
  # #     default_target_temperature_low: 90°C
  # #     heat_action:
  # #       - output.turn_on: heater_ssr
  # #     idle_action:
  # #       - output.turn_off: heater_ssr

# =============================================================================
# HEATER — native ESPHome climate entity (first-class citizen)
# This is a standard ESPHome climate entity: visible in HA, supports all
# climate actions (set_temperature, set_mode), and ESPHome's PID autotune.
# The espresso_machine orchestrator changes the setpoint during brew/steam.
#
# SUPPORTED CONTROL ALGORITHMS — choose ONE (see also docs/pid_tuning.md):
#
#  Option A — PID (active, recommended)
#    Proportional-Integral-Derivative control. Smooth, accurate, handles thermoblock
#    thermal dynamics well. Requires tuning (kp, ki, kd) — use autotune button below.
#    Best choice for ±0.5 °C accuracy.
#
#  Option B — Thermostat (bang-bang / hysteresis)
#    Simple on/off with a deadband. Easier to configure, but temperature oscillates
#    ±0.5–2 °C depending on deadband. Use only with a gpio output (Option B above).
#    No kp/ki/kd to tune — just set heat_deadband.
#    See commented block in the output section above.
#
#  Note: ESPHome does not have a built-in fuzzy-logic or model-predictive controller.
#  For advanced control, implement a custom lambda in the climate's pid output function.
# =============================================================================
climate:
  # ---------- Option A: PID (active) ----------
  - platform: pid
    id: main_heater
    name: "Espresso Heater"
    entity_category: diagnostic      # internal — user controls temperature via "Brew Temperature" number entity
    sensor: thermoblock_temp
    default_target_temperature: 90   # °C — brew temperature default (ESPHome PID uses plain number in Celsius)
    heat_output: heater_ssr
    control_parameters:
      kp: 0.55901  # proportional gain — from PID autotune
      ki: 0.11624  # integral gain — eliminates steady-state error
      kd: 0.67209  # derivative gain — damps overshoot
      output_averaging_samples: 5       # smooth output to SSR (reduces relay wear)
      derivative_averaging_samples: 5  # smooth derivative term (reduces sensor noise impact)
    # Deadband: stop integrating when within ±0.3 °C of setpoint (prevents integral windup)
    deadband_parameters:
      threshold_high: 0.3   # °C above setpoint — stop integrating
      threshold_low: -0.3   # °C below setpoint — stop integrating

# =============================================================================
# HEATER CONTROLLER ADAPTER — espresso_machine_heater platform (P1-1)
# Bridges the ESPHome climate.pid entity with the espresso_machine orchestrator
# via the IHeater interface. This enables the orchestrator to:
#   • Read thermoblock temperature from the PID sensor
#   • Set the PID target temperature for brew/steam/cool-down
#   • Force the heater off during safety cutoffs
# =============================================================================
espresso_machine_heater:
  id: heater_ctrl
  climate_id: main_heater

# =============================================================================
# VALVES — espresso_machine_valve platform (first-class citizen)
# Each valve is its own named entity, visible as a switch in HA.
# The platform enforces the single-open safety interlock: opening one valve
# automatically closes all others unless override: true is set.
# Valves default to CLOSED (normally_open: false) — safe on power loss.
# =============================================================================
espresso_machine_valve:
  - id: brew_valve
    name: "Brew Valve"
    pin: GPIO26               # ← CHANGE ME — 3-way solenoid to portafilter
    normally_open: false

  - id: steam_valve
    name: "Steam Valve"
    pin: GPIO27               # ← CHANGE ME — steam wand solenoid
    normally_open: false

  - id: purge_valve
    name: "Purge / Drain Valve"
    pin: GPIO14               # ← CHANGE ME — drain / purge solenoid
    normally_open: false

# =============================================================================
# PUMP — espresso_machine_pump platform (first-class citizen)
# Visible in HA as a switch (on/off) or number (0–100% for dimmer type).
#   type: relay   — simple on/off via relay (default; works for all machines)
#   type: dimmer  — AC phase-cut dimmer for pressure profiling (advanced)
#
# DESIGN: The flow meter is declared here (as flow_meter:) rather than in the
# espresso_machine: brew: block. The pump owns the flow subsystem because:
#   1. Rotary pumps can natively deliver specific volumes without a separate
#      flow meter; keeping flow in the pump entity makes that future change
#      transparent to the orchestrator.
#   2. All pump run() calls carry a volume parameter; the pump uses the flow
#      meter to know when to stop (temp too high, no flow for a period,
#      volume reached, or manual stop). The orchestrator never needs to
#      reference the flow meter directly.
#   3. This yields a clean separation: the orchestrator asks the pump to
#      "run until X ml" and gets flow data back through the IPump interface.
# =============================================================================
espresso_machine_pump:
  id: main_pump
  name: "Vibration Pump"
  type: relay                 # relay | dimmer
  pin: GPIO25                 # ← CHANGE ME
  flow_meter: brew_flow       # flow meter owned by the pump; see design note above

# =============================================================================
# GRINDER — espresso_machine_grinder platform (first-class citizen)
# Visible in HA as:
#   • A button  — triggers a one-shot timed grind
#   • A number  — adjusts default_grind_time (saved across reboots)
# The platform refuses to activate during an active brew or steam sequence.
#   type: relay — relay-driven motor (common in integrated grinder machines)
#   type: none  — disables the grinder (for machines without one)
# =============================================================================
espresso_machine_grinder:
  id: main_grinder
  name: "Grinder"
  type: relay                 # relay | none
  pin: GPIO23                 # ← CHANGE ME
  default_grind_time: 7s      # adjustable from HA as a number entity
  grind_time_number:
    name: "Grind Time"        # number entity in HA (ms); 0.5–30 s adjustable
    entity_category: config

# =============================================================================
# BREW PROFILES — espresso_machine_profile platform (PLANNED — not yet implemented)
# See docs/profiles.md for full design and Gaggiuino/GaggiaMate compatibility notes.
#
# Each profile is a first-class ESPHome entity: visible in HA as a selectable
# preset, switchable at runtime without firmware changes.
#
# To start a shot using a specific profile (future API):
#   - espresso_machine.brew_start:
#       id: my_espresso
#       profile: profile_classic_9bar
#
# Or from Home Assistant:
#   service: esphome.philips_barista_brew_brew_start
#   data:
#     profile: "Classic 9-Bar"
#
# espresso_machine_profile:
#
#   # ── Classic straight pull ──────────────────────────────────────────────
#   - id: profile_classic_9bar
#     name: "Classic 9-Bar"
#     description: "Traditional Italian-style extraction at 9 bar."
#     temperature: 93°C
#     phases:
#       - name: "Pre-infusion"
#         type: pressure
#         target: 2bar
#         duration: 7s
#         ramp: linear
#       - name: "Extraction"
#         type: pressure
#         target: 9bar
#         exit:
#           volume_ml: 36ml   # stop when 36 ml have passed the flow meter
#
#   # ── Bloom / adaptive (good for light roasts) ──────────────────────────
#   - id: profile_bloom
#     name: "Bloom / Adaptive"
#     description: "Gentle bloom, pressure ramp, hold, and decline."
#     temperature: 90°C
#     phases:
#       - name: "Bloom"
#         type: pressure
#         target: 2bar
#         duration: 7s
#         ramp: linear
#       - name: "Ramp"
#         type: pressure
#         target_start: 2bar
#         target_end: 9bar
#         duration: 5s
#         ramp: ease_in
#       - name: "Hold"
#         type: pressure
#         target: 9bar
#         duration: 20s
#       - name: "Decline"
#         type: pressure
#         target_start: 9bar
#         target_end: 3bar
#         duration: 10s
#         ramp: ease_out
#         exit:
#           volume_ml: 40ml
#
#   # ── Flow control (requires dimmer-type pump) ───────────────────────────
#   - id: profile_flow_control
#     name: "Flow Control"
#     description: "Constant-flow extraction — requires pump: type: dimmer."
#     temperature: 92°C
#     phases:
#       - name: "Pre-infusion"
#         type: flow
#         target: 2ml/s
#         duration: 6s
#       - name: "Extraction"
#         type: flow
#         target: 3ml/s
#         exit:
#           volume_ml: 38ml
# =============================================================================

# =============================================================================
# ESPRESSO MACHINE — orchestrator (first-class citizen)
# References all entities above by id:.  Does not own any hardware directly.
# Manages the brew and steam state machines and coordinates safety interlocks.
# Exposes mode sensor, shot stats, and start/stop actions to HA.
# =============================================================================
espresso_machine:
  id: my_espresso
  # active_profile: profile_classic_9bar   # ← PLANNED: uncomment when profiles are implemented

  # Status sensor — reports detailed state to HA immediately on every state change.
  # Values: "Idle" | "Brew: Heating" | "Brew: Pre-infusion" | "Brewing" |
  #         "Brew: Finishing" | "Brew: Cleanup" | "Steam: Heating" |
  #         "Steam: Purging" | "Steaming" | "Steam: Cooling" | "Steam: Cleanup" |
  #         "Flushing"
  status_sensor:
    name: "Espresso Status"

  # ---------------------------------------------------------------------------
  # Brew mode — full espresso shot sequence
  # State machine: idle → heating → brewing → done → cleanup
  # ---------------------------------------------------------------------------
  brew:
    heater: main_heater           # id of the climate entity above
    heater_controller: heater_ctrl  # IHeater adapter — enables setpoint wiring and temp surfing (P1-2/P1-3)
    pump: main_pump               # id of the pump entity above
    valve: brew_valve             # id of the valve entity above
    purge_valve: purge_valve      # id of the valve entity above

    # target_temperature is intentionally omitted here.
    # The brew sequence uses whatever setpoint the PID climate currently has,
    # which lets you adjust temperature freely from Home Assistant without it
    # being reset back to a fixed value on every shot.

    # Temperature surfing: at shot start the heater setpoint is raised by
    # `offset`, then linearly decays back to target_temperature over ramp_time.
    # Compensates for heat absorbed by the cold portafilter.
    # Requires heater_controller: to be wired (P1-3).
    temperature_profile:
      offset: 5°C               # °C above target_temperature at shot start
      ramp_time: 20s            # time to decay back to target_temperature
      # Optional HA switch — enables/disables temperature surfing at runtime
      # without reflashing.  Defaults to ON (surfing active) when the device boots.
      temp_surf_switch:
        name: "Temperature Surfing"   # switch entity in HA

    # Stop the shot when this many ml have passed the flow meter
    flow_max: 40ml
    # Expose flow_max as a HA number entity — adjustable at runtime without reflashing
    flow_max_number:
      name: "Brew Flow Max"      # number entity in HA (mL); 10–200 mL adjustable
    # ml absorbed by puck + basket; subtracted from flow reading for HA yield display
    flow_offset: 20ml

    # Shot statistics — native HA sensor entities updated after each completed shot (P1-5)
    shot_stats:
      last_shot_time:
        name: "Last Shot Time"          # seconds
      last_shot_volume:
        name: "Last Shot Volume"        # mL total through flow meter
      last_shot_yield:
        name: "Last Shot Yield"         # mL net yield (volume minus puck absorption)

    # Cleanup: automatically flush brew path after shot completes.
    # The cleanup_script callback fires when the brew sequence enters CLEANUP.
    # Reference a script: block by id to run custom rinse or flush sequences.
    # Example: cleanup_script: my_brew_rinse_script
    # For a simple group-head rinse use the espresso_machine.flush action instead.
    cleanup_script:
      - delay: 2s
      - espresso_machine_pump.run:
          id: main_pump
          volume_ml: 20ml

  # ---------------------------------------------------------------------------
  # Steam mode — milk steaming sequence
  # State machine: idle → heating → purging → steaming → cooling → cleanup
  #
  # Correct sequence:
  #   1. HEATING   — raise thermoblock to target_temperature; valves closed
  #   2. PURGING   — pump water through purge_valve to flush residual water;
  #                  ensures only dry steam reaches the wand
  #   3. STEAMING  — close purge valve, open steam valve; bang-bang pump
  #                  control maintains flow_max ml/s rate
  #   4. COOLING   — on stop: close steam valve, reopen purge valve,
  #                  lower heater to cool_down_to; wait for temp to drop
  #   5. CLEANUP   — close purge valve; return to idle
  # ---------------------------------------------------------------------------
  steam:
    heater: main_heater           # id of the climate entity above
    heater_controller: heater_ctrl  # IHeater adapter — temperature-gated HEATING and COOLING (P1-2)
    pump: main_pump               # id of the pump entity above
    valve: steam_valve            # id of the valve entity above
    purge_valve: purge_valve      # id of the valve entity above

    # Temperature to reach before starting the purge / opening the steam valve
    target_temperature: 135°C

    # Volume (ml) to pump through the purge valve before opening the steam valve.
    # This flushes residual water so only dry steam exits the wand.
    # Remove or set to 0 to skip the purge phase (backward-compatible).
    purge_volume: 5ml

    # Pump duty-cycle target during steaming (ml/s)
    # The pump pulses on/off to maintain this average flow rate.
    # Set to 0 for passive steam only (no pump assist).
    flow_max: 2ml/s

    # After steaming, ramp the heater back to this temperature automatically
    # so the machine is ready for the next shot without manual intervention.
    cool_down_to: 90°C

    # Safety timeout: automatically stop steaming after this duration.
    # Protects against forgotten steaming sessions.  0 or omitted = disabled.
    timeout: 5min

    # Minimum time the pump must stay ON before it can be toggled off in the
    # bang-bang steam flow-rate controller.  Reducing this may cause rapid
    # on/off cycling that wears out the pump solenoid.  Default: 2s. (P2-7)
    pump_min_on_time: 2s

    # Cleanup: purge steam path after cool-down.
    # The cleanup_script callback fires when the steam sequence enters CLEANUP.
    # Reference a script: block by id to run custom rinse or flush sequences.
    # Example: cleanup_script: my_steam_rinse_script
    # For inline group-head flushing use the espresso_machine.flush action instead.
    cleanup_script:
      - espresso_machine_valve.open: purge_valve
      - espresso_machine_pump.run:
          id: main_pump
          volume_ml: 10ml
      - espresso_machine_valve.close: purge_valve

# =============================================================================
# DISPLAY (optional) — native ESPHome SSD1306 via I2C
# Comment out this entire block if you do not have a display attached.
# =============================================================================
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.printf(0,  0, id(font_small), "Mode: %s",
        id(my_espresso).mode_name());
      it.printf(0, 16, id(font_small), "T: %.1f / %.1f C",
        id(main_heater).current_temperature,
        id(main_heater).target_temperature);
      it.printf(0, 32, id(font_small), "Vol: %.1f ml",
        id(brew_flow).total_volume());
      it.printf(0, 48, id(font_small), "Heat: %.0f%%",
        id(main_heater).output_value() * 100.0f);

font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 12

# =============================================================================
# POWER SWITCH — master on/off toggle
#
# Turning ON:  powers the machine on and enables the PID heater → the
#              thermoblock starts warming to the last-set temperature.
#
# Turning OFF: safely shuts the machine down.
#   • If idle:    hardware is already safe — power flag cleared immediately.
#   • If brewing: brew sequence stopped immediately (safe to interrupt).
#   • If steaming or cooling: the cool-down + purge sequence completes
#                             automatically before the machine idles.
#                             This prevents residual steam pressure from
#                             being trapped in the circuit.
#
# restore_mode: RESTORE_DEFAULT_OFF — starts OFF on first boot (no saved state);
# on subsequent boots restores the last on/off state from flash. This means a
# power failure does not force the machine off permanently — it comes back in
# the same state it was in before the outage.
# =============================================================================
switch:
  - platform: template
    id: machine_power
    name: "Espresso Machine Power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      # 1. Enable the orchestrator logic
      - lambda: id(my_espresso).machine_on();
      # 2. Enable the PID heater so the thermoblock begins warming immediately
      - climate.control:
          id: main_heater
          mode: heat
    turn_off_action:
      # 1. Safely shut down the orchestrator (handles any active brew/steam sequence)
      - lambda: id(my_espresso).machine_off();
      # 2. Disable the PID heater (orchestrator handles active sequences first)
      - climate.control:
          id: main_heater
          mode: "off"

# =============================================================================
# BUTTONS — restart and PID autotune
# =============================================================================
button:
  - platform: restart
    name: "Restart"

  # Trigger ESPHome's built-in PID autotune from HA — see docs/pid_tuning.md
  - platform: template
    name: "PID Autotune"
    on_press:
      - climate.pid.autotune: main_heater

  # ---------------------------------------------------------------------------
  # Brew and steam start / stop — the four core machine actions.
  # Pressing a button calls the corresponding action on the orchestrator.
  # ---------------------------------------------------------------------------
  - platform: template
    name: "Brew Start"
    on_press:
      - lambda: id(my_espresso).brew_start();

  - platform: template
    name: "Brew Stop"
    on_press:
      - lambda: id(my_espresso).brew_stop();

  - platform: template
    name: "Steam Start"
    on_press:
      - lambda: id(my_espresso).steam_start();

  - platform: template
    name: "Steam Stop"
    on_press:
      - lambda: id(my_espresso).steam_stop();

# =============================================================================
# NUMBER ENTITIES — adjustable parameters exposed to HA
# =============================================================================
number:
  # Brew temperature — change from HA without reflashing; syncs with PID climate
  # The PID climate entity (main_heater) remains visible in HA as-is.
  - platform: template
    name: "Brew Temperature"
    id: brew_temp_number
    unit_of_measurement: "°C"
    min_value: 85
    max_value: 105
    step: 0.5
    initial_value: 90
    optimistic: true
    restore_value: true
    set_action:
      - climate.control:
          id: main_heater
          target_temperature: !lambda "return x;"

# =============================================================================
# TEXT SENSOR — exposes the current machine mode to HA
# Values: "idle" | "brewing" | "steaming"
# The status_sensor (wired directly in the espresso_machine block above)
# provides more granular status updates pushed immediately on state changes.
# This template sensor is kept as a polling fallback for the coarse mode.
# =============================================================================
text_sensor:
  - platform: template
    name: "Machine Mode"
    id: machine_mode
    update_interval: 2s
    lambda: return std::string(id(my_espresso).mode_name());

# =============================================================================
# BUTTONS — same as real config
# =============================================================================
button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "PID Autotune"
    on_press:
      - climate.pid.autotune: main_heater

  - platform: template
    name: "Brew Start"
    on_press:
      - lambda: id(my_espresso).brew_start();

  - platform: template
    name: "Brew Stop"
    on_press:
      - lambda: id(my_espresso).brew_stop();

  - platform: template
    name: "Steam Start"
    on_press:
      - lambda: id(my_espresso).steam_start();

  - platform: template
    name: "Steam Stop"
    on_press:
      - lambda: id(my_espresso).steam_stop();

  # Additional button to reset flow counter for new shot
  - platform: template
    name: "Reset Flow"
    on_press:
      - espresso_machine_mock_pump.reset: main_pump

# =============================================================================
# TEXT SENSOR — same as real config
# =============================================================================
text_sensor:
  - platform: template
    name: "Machine Mode"
    id: machine_mode
    update_interval: 2s
    lambda: return std::string(id(my_espresso).mode_name());

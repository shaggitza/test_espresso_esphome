# =============================================================================
# ESPHome Espresso Machine Controller — MOCK HARDWARE SIMULATION
# Based on: philips_barista_brew.yaml (section-for-section mirror)
#
# PURPOSE:
#   Exercise the orchestrator + PID loop without physical hardware.
#   The PID and orchestrator are completely unchanged and cannot distinguish
#   mock from real hardware. All physics parameters are HA-tunable.
#
# HOW TO USE:
#   1. Copy to your ESPHome config directory.
#   2. Create secrets.yaml with Wi-Fi credentials.
#   3. Run:  esphome run philips_barista_brew_mock.yaml
#   4. Observe PID behavior in HA — adjust physics params via number entities.
#
# WHAT'S MOCKED:
#   Real                                    Mock
#   ────                                    ────
#   spi: + sensor: max31855 + output:       espresso_machine_mock_heater:
#     slow_pwm                                (thermal ODE simulation)
#   espresso_machine_flow_meter: +          espresso_machine_mock_pump:
#     espresso_machine_pump:                  (puck density + pressure model)
#
# WHAT'S IDENTICAL TO THE REAL CONFIG:
#   - climate: pid block (same gains, deadband, sensor/heat_output IDs)
#   - espresso_machine: orchestrator (brew/steam config, pre-infusion, targets)
#   - All buttons, shot-stat sensors, display lambda, text sensor
#   - Valves and grinder — unchanged, on dummy GPIOs
#   - HA runtime tuning
#
# THERMAL MODEL (mock heater):
#   dT/dt = (duty × P − h × (T − T_amb) − Q × Cp × ε × (T − T_inlet)) / C
#     duty   = 0.0–1.0 from PID
#     P      = power_watts
#     C      = thermal_mass_j_per_c
#               800g Al × 0.897 J/(g·°C) + 20mL × 4.186 J/(mL·°C) ≈ 800 J/°C
#     h      = heat_loss_w_per_c
#     T_amb  = ambient_temperature
#     Q      = flow rate [mL/s] from mock pump (IFlowObserver)
#     Cp     = 4.186 J/(mL·°C), specific heat of water
#     T_inlet = water_inlet_temp_c
#     ε      = heat transfer effectiveness = 1 − exp(−k / Q)
#       At low flow rates (Q << k), ε ≈ 1 (water fully heats/cools)
#       At high flow rates (Q >> k), ε ≈ k/Q (less efficient per mL)
#       k      = heat_transfer_k (default 2.0 mL/s) — tunable parameter
#
# BYPASS MODE (mock pump):
#   When the orchestrator calls set_bypass_mode(true), the pump simulates
#   flowing through an open valve (steam/purge) instead of a puck.
#   In bypass mode: D_eff = 1, flow = nominal_flow, pressure = 0 bar.
#
# PUCK DENSITY MODEL (mock pump):
#   puck_density = 1..100  (1 = open, 100 = fully blocked)
#   flow_fraction = (101 − D) / 100
#   Q_ss          = nominal_flow × flow_fraction
#   P_equilibrium = pump_max_pressure × (D − 1) / 100
#
#   Examples with nominal_flow=4 mL/s, pump_max_pressure=15 bar:
#     D=1   (open)   → Q ≈ 4.0 mL/s, P_eq ≈ 0 bar
#     D=25  (soft)   → Q ≈ 3.0 mL/s, P_eq ≈ 3.6 bar
#     D=50  (medium) → Q ≈ 2.0 mL/s, P_eq ≈ 7.35 bar
#     D=75  (hard)   → Q ≈ 1.04 mL/s, P_eq ≈ 11.1 bar
#     D=100 (blocked)→ Q ≈ 0.04 mL/s, P_eq ≈ 14.85 bar
#
# PRESSURE MODEL:
#   Pressure builds quickly (τ_rise = 1.5 s) toward P_equilibrium.
#   At D=100 it climbs to near pump stall pressure (no water can escape).
#
# WETTING MODEL:
#   effective_τ = puck_time_constant × (D / 100)
#   Q(t) = Q_ss × (1 − exp(−t / effective_τ))
#
# RESIDUAL PRESSURE DECAY MODEL (mock pump):
#   When the pump stops, trapped pressurised water continues to drive flow:
#   τ_decay = internal_volume_ml / nominal_flow  (e.g. 20 mL / 4 mL·s⁻¹ = 5 s)
#   Set internal_volume_ml = 0 to disable (legacy instant-decay behaviour).
#
# HA ENTITY CATEGORIES:
#   config     — Mock physics parameters and puck preset buttons appear in the
#                "Configuration" section of the HA device page.
#   diagnostic — Mock pump switch, mock-only sensors (nozzle flow, SSR duty,
#                mock brew pump pressure), valves, and system/uptime diagnostics
#                appear in the "Diagnostics" section.
#   (none)     — Primary user-facing entities (machine mode, brew temperature,
#                brew flow max, brew flow sensors, start/stop/action buttons)
#                appear at the top of the device page.
#   NOTE: The PID climate entity is categorized as diagnostic — users control
#         brew temperature via the "Brew Temperature" number entity (Controls).
#   See docs/home_assistant.md for the full rationale and category decisions.
# =============================================================================

# -----------------------------------------------------------------------------
# ESPHome core
# -----------------------------------------------------------------------------
esphome:
  name: philips_barista_brew_mock
  friendly_name: "Philips Barista Brew (Mock)"
  comment: "Simulated espresso machine — no physical hardware required"
  # Required when using espresso_machine_brewos — WebSocket client for BrewOS cloud.
  # Remove this block if you are not using cloud connectivity.
  platformio_options:
    lib_deps:
      - links2004/WebSockets@^2.4.0

esp32:
  board: esp32dev
  framework:
    type: arduino

# -----------------------------------------------------------------------------
# Logging — keep INFO for production, DEBUG if tuning physics params
# -----------------------------------------------------------------------------
logger:
  level: INFO
  # level: DEBUG  # Uncomment to see detailed thermal/flow simulation logs

# -----------------------------------------------------------------------------
# Home Assistant API
# -----------------------------------------------------------------------------
api:
  encryption:
    key: !secret ha_api_key

# -----------------------------------------------------------------------------
# OTA updates
# -----------------------------------------------------------------------------
ota:
  - platform: esphome
    password: !secret ota_password

# -----------------------------------------------------------------------------
# Wi-Fi
# -----------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# -----------------------------------------------------------------------------
# External components — pulls all espresso_machine platforms from this repo
# -----------------------------------------------------------------------------
external_components:
  - source: github://shaggitza/test_espresso_esphome@main
    components:
      - espresso_machine
      - espresso_machine_valve
      - espresso_machine_pump
      - espresso_machine_grinder
      - espresso_machine_flow_meter
      - espresso_machine_heater        # production IHeater adapter for climate.pid
      - espresso_machine_mock_heater   # ← thermal simulation (temp sensor + SSR output)
      - espresso_machine_mock_pump     # ← pump + flow simulation
      - espresso_machine_brewos        # BrewOS cloud connectivity (optional)

# =============================================================================
# MOCK HEATER — replaces physical thermocouple + slow_pwm + SPI
#
# The PID climate entity references:
#   sensor: thermoblock_temp    → MockHeaterTempSensor (same ID as real config)
#   heat_output: heater_ssr     → MockHeaterOutput (same ID as real config)
#
# Physics parameters (800g Al block + 20mL water thermoblock at 1.2 kW):
#   power_watts: 1200.0                — heater element power
#   thermal_mass_j_per_c: 800.0       — 800g Al (717.6) + 20mL H₂O (83.7)
#   heat_loss_w_per_c: 1.7            — calibrated for realistic cooling rate
#   water_inlet_temp_c: 20.0          — cold-water inlet temperature
#   heat_transfer_k: 2.0              — heat transfer constant [mL/s]
#                                       (at Q=k, effectiveness ≈ 63%)
#
# duty_sensor shows the SSR duty cycle (0–100%) in HA so you can see
# how quickly the SSR is switching during PID control.
# =============================================================================
espresso_machine_mock_heater:
  id: mock_heater
  initial_temperature: 25.0
  ambient_temperature: 25.0
  power_watts: 1200.0
  thermal_mass_j_per_c: 800.0    # 800g Al block + 20mL water
  heat_loss_w_per_c: 1.7
  water_inlet_temp_c: 20.0
  heat_transfer_k: 2.0           # Heat transfer effectiveness constant [mL/s]

  # Temperature sensor — same ID as physical max6675/max31855
  temperature_sensor:
    id: thermoblock_temp
    name: "Thermoblock Temperature"
    # Safety: hard over-temperature cutoff — independent of PID
    on_value_range:
      - above: 165
        then:
          - climate.control:
              id: main_heater
              mode: "off"
          - logger.log:
              format: "SAFETY: Over-temperature cutoff (%.1f °C). Heater forced OFF."
              args: ["x"]
              level: ERROR

  # Output — same ID as physical slow_pwm
  output:
    id: heater_ssr

  # HA number entities for runtime tuning of physics parameters
  power_number:
    name: "Mock Heater Power"
    entity_category: config
  thermal_mass_number:
    name: "Mock Thermal Mass"
    entity_category: config
  heat_loss_number:
    name: "Mock Heat Loss"
    entity_category: config
  ambient_number:
    name: "Mock Ambient Temperature"
    entity_category: config
  heat_transfer_k_number:
    name: "Mock Heat Transfer K"
    entity_category: config

  # Duty-cycle sensor — shows SSR switching intensity in HA (0–100%)
  duty_sensor:
    name: "Heater SSR Duty"
    unit_of_measurement: "%"

# =============================================================================
# MOCK PUMP — replaces physical relay pump + flow meter
#
# The orchestrator references:
#   pump: main_pump             → MockPump (same ID as real config)
#
# Flow data is provided through the IPump interface — no separate flow meter
# component needed. The orchestrator's pump->get_flow_total() works unchanged.
#
# Puck density model:
#   puck_density: 50  → medium puck (Q ≈ 2 mL/s, P_eq ≈ 7.4 bar at these settings)
#   Use the puck density preset buttons or the HA number entity to simulate
#   different coffee pucks from fully open (D=1) to completely blocked (D=100).
#
# Pressure model:
#   System pressure rises quickly (τ_rise=1.5s) to P_eq = pump_max×(D-1)/100.
#   At D=100 pressure climbs toward pump stall pressure (blocked puck).
# =============================================================================
espresso_machine_mock_pump:
  id: main_pump
  name: "Mock Pump"
  nominal_flow_ml_per_s: 4.0
  pump_max_pressure_bar: 15.0    # Ulka EP5 stall pressure
  puck_time_constant_s: 10.0
  puck_density: 50               # 1=open (max flow), 100=blocked (~0 flow)
  # Internal volume of tubing + piping [mL]. Residual pressure after pump stops
  # continues to drive flow with τ_decay = internal_volume / nominal_flow = 5 s.
  # Increase to slow down post-stop flow; set to 0 to revert to instant-decay.
  internal_volume_ml: 20.0
  mock_heater: mock_heater

  # Pump-side flow sensors — water volume through the pump
  rate_sensor:
    name: "Brew Flow Rate"
  total_sensor:
    name: "Brew Flow Total"
  pressure_sensor:
    name: "Mock Brew Pump Pressure"

  # Nozzle flow sensors — estimated output from the group head
  nozzle_rate_sensor:
    name: "Nozzle Flow Rate"
  nozzle_total_sensor:
    name: "Nozzle Flow Total"

  # HA number entities for runtime tuning (entity_category: config keeps
  # them separate from primary sensors on the HA device page)
  nominal_flow_number:
    name: "Mock Nominal Flow"
    entity_category: config
  pump_max_pressure_number:
    name: "Mock Pump Max Pressure"
    entity_category: config
  puck_time_constant_number:
    name: "Mock Puck Time Constant"
    entity_category: config
  puck_density_number:
    id: main_pump_puck_density
    name: "Mock Puck Density"
    entity_category: config
  internal_volume_number:
    name: "Mock Internal Volume"
    entity_category: config

# =============================================================================
# ADDITIONAL SENSORS — same as real config
# =============================================================================
sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: internal_temperature
    name: "ESP32 Temperature"
    entity_category: diagnostic

# =============================================================================
# HEATER PID — IDENTICAL to real config (uses same sensor/output IDs)
#
# This is completely unchanged from philips_barista_brew.yaml.
# The PID has no idea it's controlling a simulated heater.
# =============================================================================
climate:
  - platform: pid
    id: main_heater
    name: "Espresso Heater"
    entity_category: diagnostic      # internal — user controls temperature via "Brew Temperature" number entity
    sensor: thermoblock_temp           # ← reads from MockHeaterTempSensor
    default_target_temperature: 90
    heat_output: heater_ssr            # ← writes to MockHeaterOutput
    control_parameters:
      kp: 0.55901
      ki: 0.11624
      kd: 0.67209
      output_averaging_samples: 5
      derivative_averaging_samples: 5
    deadband_parameters:
      threshold_high: 0.3
      threshold_low: -0.3

# =============================================================================
# HEATER CONTROLLER — IHeater adapter that wraps the PID climate entity
#
# The mock heater simulates temperature physics (sensor + SSR output).
# This adapter controls the PID setpoint when the orchestrator calls
# set_target_temperature() for brew/steam temperature changes.
# =============================================================================
espresso_machine_heater:
  id: heater_ctrl
  climate_id: main_heater

# =============================================================================
# VALVES — unchanged from real config (dummy GPIOs, no physical hardware)
# =============================================================================
espresso_machine_valve:
  - id: brew_valve
    name: "Brew Valve"
    pin: GPIO26
    normally_open: false

  - id: steam_valve
    name: "Steam Valve"
    pin: GPIO27
    normally_open: false

  - id: purge_valve
    name: "Purge / Drain Valve"
    pin: GPIO14
    normally_open: false

# =============================================================================
# GRINDER — unchanged from real config (dummy GPIO)
# =============================================================================
espresso_machine_grinder:
  id: main_grinder
  name: "Grinder"
  type: relay
  pin: GPIO23
  default_grind_time: 7s
  grind_time_number:
    name: "Grind Time"

# =============================================================================
# ORCHESTRATOR — IDENTICAL to real config
#
# The orchestrator uses the same IDs and has no idea it's running on mocks.
# =============================================================================
espresso_machine:
  id: my_espresso

  # Status sensor — reports detailed state to HA immediately on every state change.
  # Values: "Idle" | "Brew: Heating" | "Brew: Pre-infusion" | "Brewing" |
  #         "Brew: Finishing" | "Brew: Cleanup" | "Steam: Heating" |
  #         "Steam: Purging" | "Steaming" | "Steam: Cooling" | "Steam: Cleanup" |
  #         "Flushing"
  status_sensor:
    name: "Espresso Status"

  brew:
    heater: main_heater
    heater_controller: heater_ctrl   # IHeater adapter — controls PID setpoint for temperature-gated transitions (P1-2/P1-3)
    pump: main_pump
    valve: brew_valve
    purge_valve: purge_valve
    # target_temperature omitted — managed from HA directly (PID entity)
    temperature_profile:
      offset: 5°C
      ramp_time: 20s
      temp_surf_switch:
        name: "Temperature Surfing"   # switch entity in HA; toggles surfing on/off at runtime
    flow_max: 40ml
    flow_max_number:
      name: "Brew Flow Max"      # number entity in HA (mL); 10–200 mL adjustable
    flow_offset: 20ml
    shot_stats:                          # P1-5: native HA sensor entities for shot statistics
      last_shot_time:
        name: "Last Shot Time"
      last_shot_volume:
        name: "Last Shot Volume"
      last_shot_yield:
        name: "Last Shot Yield"
    # cleanup_script fires when brew enters CLEANUP. Reference a script by id.
    # cleanup_script: my_brew_rinse_script
    # For simple flushing, use the espresso_machine.flush action (see button block).

  steam:
    heater: main_heater
    heater_controller: heater_ctrl   # IHeater adapter — controls PID setpoint for temperature-gated transitions
    pump: main_pump
    valve: steam_valve
    purge_valve: purge_valve
    target_temperature: 135°C
    # Pump 5 ml through the purge valve before opening the steam valve to flush
    # residual water so only dry steam exits the wand (PURGING state).
    purge_volume: 5ml
    flow_max: 2ml/s
    cool_down_to: 90°C
    # Safety timeout: stop steaming after 5 minutes even if not manually stopped.
    timeout: 5min
    # Minimum time the pump must stay ON before toggling off in bang-bang control.
    # Reduces pump wear. Default is 2s. (P2-7)
    pump_min_on_time: 2s
    # cleanup_script fires when steam enters CLEANUP. Reference a script by id.
    # cleanup_script: my_steam_rinse_script

# =============================================================================
# BREWOS CLOUD CONNECTIVITY (optional) — mirrors real config
#
# Works identically in the mock build: the connector sends simulated machine
# state to the cloud and dispatches cloud commands to the mock orchestrator.
# Useful for end-to-end integration testing without physical hardware.
#
# See examples/philips_barista_brew.yaml for full documentation.
# =============================================================================
espresso_machine_brewos:
  url: https://cloud.brewos.io    # ← CHANGE ME if self-hosting
  espresso_machine: my_espresso   # same orchestrator ID as the real config

# =============================================================================
# DISPLAY — optional (same as real config)
# Comment out if no I2C display attached.
# =============================================================================
# i2c:
#   sda: GPIO21
#   scl: GPIO22
#
# display:
#   - platform: ssd1306_i2c
#     model: "SSD1306 128x64"
#     address: 0x3C
#     lambda: |-
#       it.printf(0,  0, id(font_small), "Mode: %s",
#         id(my_espresso).mode_name());
#       it.printf(0, 16, id(font_small), "T: %.1f / %.1f C",
#         id(main_heater).current_temperature,
#         id(main_heater).target_temperature);
#       it.printf(0, 32, id(font_small), "Vol: %.1f ml",
#         id(main_pump).get_flow_total());
#       it.printf(0, 48, id(font_small), "Heat: %.0f%%",
#         id(main_heater).output_value() * 100.0f);
#
# font:
#   - file: "gfonts://Roboto Mono"
#     id: font_small
#     size: 12

# =============================================================================
# POWER SWITCH — master on/off toggle (same as real config)
# =============================================================================
switch:
  - platform: template
    id: machine_power
    name: "Espresso Machine Power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(my_espresso).machine_on();
      - climate.control:
          id: main_heater
          mode: heat
    turn_off_action:
      - lambda: id(my_espresso).machine_off();
      - climate.control:
          id: main_heater
          mode: "off"

# =============================================================================
# BUTTONS — same as real config
# =============================================================================
button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "PID Autotune"
    on_press:
      - climate.pid.autotune: main_heater

  - platform: template
    name: "Brew Start"
    on_press:
      - lambda: id(my_espresso).brew_start();

  - platform: template
    name: "Brew Stop"
    on_press:
      - lambda: id(my_espresso).brew_stop();

  - platform: template
    name: "Steam Start"
    on_press:
      - lambda: id(my_espresso).steam_start();

  - platform: template
    name: "Steam Stop"
    on_press:
      - lambda: id(my_espresso).steam_stop();

  # Additional button to reset flow counter for new shot
  - platform: template
    name: "Reset Flow"
    on_press:
      - espresso_machine_mock_pump.reset: main_pump

  # Puck density presets — simulate different coffee pucks.
  # With nominal_flow=4 mL/s and pump_max_pressure=15 bar:
  #   D=1   (open)    → Q ≈ 4.0 mL/s, P_eq ≈ 0 bar
  #   D=25  (soft)    → Q ≈ 3.0 mL/s, P_eq ≈ 3.6 bar
  #   D=50  (medium)  → Q ≈ 2.0 mL/s, P_eq ≈ 7.4 bar
  #   D=75  (hard)    → Q ≈ 1.0 mL/s, P_eq ≈ 11.1 bar
  #   D=100 (blocked) → Q ≈ 0.04 mL/s, P_eq ≈ 15 bar
  - platform: template
    name: "Puck: Open (D=1)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 1

  - platform: template
    name: "Puck: Soft (D=25)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 25

  - platform: template
    name: "Puck: Medium (D=50)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 50

  - platform: template
    name: "Puck: Hard (D=75)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 75

  - platform: template
    name: "Puck: Blocked (D=100)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 100

# =============================================================================
# NUMBER ENTITIES — adjustable parameters exposed to HA
# =============================================================================
number:
  # Brew temperature — change from HA without reflashing; syncs with PID climate
  # The PID climate entity (main_heater) remains visible in HA as-is.
  - platform: template
    name: "Brew Temperature"
    id: brew_temp_number
    unit_of_measurement: "°C"
    min_value: 85
    max_value: 105
    step: 0.5
    initial_value: 90
    optimistic: true
    restore_value: true
    set_action:
      - climate.control:
          id: main_heater
          target_temperature: !lambda "return x;"

# =============================================================================
# TEXT SENSOR — exposes the current machine mode to HA (polling fallback)
# The status_sensor above provides push-on-change status with more detail.
# =============================================================================
text_sensor:
  - platform: template
    name: "Machine Mode"
    id: machine_mode
    update_interval: 2s
    lambda: return std::string(id(my_espresso).mode_name());

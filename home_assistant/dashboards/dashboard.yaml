# =============================================================================
# Lovelace Dashboard — Espresso Machine (Unified: Real + Simulation)
# =============================================================================
#
# HOW TO INSTALL
# --------------
# 1. In Home Assistant: Settings → Dashboards → Add Dashboard
# 2. Name it "Espresso Machine", icon mdi:coffee-maker
# 3. Open the dashboard → three-dot menu → "Edit Dashboard"
# 4. Three-dot menu again → "Raw configuration editor"
# 5. Replace ALL content with this file (starting from `title:`) and Save.
#
# ⚡ MAINTENANCE RULE ⚡
# ─────────────────────
# Whenever a new entity is added to the ESPHome firmware (real or mock),
# add the corresponding card to this dashboard in the same PR.
# Real device cards → prefix: philips_barista_brew
# Mock device cards → prefix: philips_barista_brew_mock
#
# REQUIRED HACS CUSTOM CARDS
# ---------------------------
# Install via HACS → Frontend before using this dashboard:
#   1. mushroom        — https://github.com/piitaya/lovelace-mushroom
#   2. mini-graph-card — https://github.com/kalkih/mini-graph-card
#   3. apexcharts-card — https://github.com/RomRider/apexcharts-card
#   4. button-card     — https://github.com/custom-cards/button-card
#   5. layout-card     — https://github.com/thomasloven/lovelace-layout-card
#
# ENTITY PREFIXES
# ---------------
# Real hardware:  philips_barista_brew
# Mock/sim device: philips_barista_brew_mock
# (If your device has a different name, search-and-replace both prefixes.)
#
# SHOT HISTORY SETUP
# ------------------
# The Shot History view requires the AppDaemon app and HA helpers from:
#   home_assistant/appdaemon/shot_history.py
#   home_assistant/helpers.yaml
#   home_assistant/template_sensors.yaml
# Follow CUSTOM_UI.md for setup instructions.
# =============================================================================

title: ☕ Espresso Machine

views:
  # ===========================================================================
  # VIEW 1 — LIVE CONTROL (Real Hardware)
  # Three-column futuristic layout:
  #   Column 1 (left)  : Status chips + primary action buttons
  #   Column 2 (centre): Live sensor readings + adjustable settings
  #   Column 3 (right) : Live temperature + flow graphs
  # ===========================================================================
  - title: Control
    icon: mdi:coffee-maker
    path: control
    type: custom:grid-layout
    layout:
      grid-template-columns: "1fr 1fr 1fr"
      grid-gap: "12px 12px"
      padding: "8px"
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: "1fr 1fr"
        "(max-width: 600px)":
          grid-template-columns: "1fr"
    cards:

      # -----------------------------------------------------------------------
      # COLUMN 1 — STATUS + ACTION BUTTONS
      # -----------------------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-column: "1"
        cards:

          # Machine status chips
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:coffee-maker-check
                icon_color: >-
                  {% set mode = states('text_sensor.philips_barista_brew_machine_mode') %}
                  {% if mode == 'brewing' %} amber
                  {% elif mode == 'steaming' %} blue
                  {% else %} green
                  {% endif %}
                content: >-
                  {% set mode = states('text_sensor.philips_barista_brew_machine_mode') | upper %}
                  {{ mode if mode not in ('UNKNOWN','UNAVAILABLE') else 'OFFLINE' }}
                tap_action:
                  action: none
              - type: template
                icon: mdi:thermometer
                icon_color: >-
                  {% set t = states('sensor.philips_barista_brew_thermoblock_temperature') | float(0) %}
                  {% if t >= 125 %} red
                  {% elif t >= 85 %} amber
                  {% else %} blue
                  {% endif %}
                content: >-
                  {{ states('sensor.philips_barista_brew_thermoblock_temperature') | round(1) }} °C
                tap_action:
                  action: none
              - type: template
                icon: mdi:water
                icon_color: teal
                content: >-
                  {{ states('sensor.philips_barista_brew_brew_flow_total') | round(1) }} mL
                tap_action:
                  action: none

          # Master power switch
          - type: custom:mushroom-entity-card
            entity: switch.philips_barista_brew_espresso_machine_power
            name: Machine Power
            icon: mdi:power
            icon_color: >-
              {{ 'green' if is_state('switch.philips_barista_brew_espresso_machine_power', 'on') else 'red' }}
            tap_action:
              action: toggle

          # BREW buttons
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: button.philips_barista_brew_brew_start
                name: BREW
                label: START
                show_label: true
                icon: mdi:play-circle
                styles:
                  card:
                    - height: "90px"
                    - background: "linear-gradient(135deg, rgba(0,40,20,0.85), rgba(0,70,30,0.4))"
                    - border: "1px solid rgba(0,255,128,0.45)"
                    - box-shadow: "0 0 18px rgba(0,255,128,0.15), 0 4px 12px rgba(0,0,0,0.4)"
                    - border-radius: "14px"
                  name:
                    - font-size: "17px"
                    - letter-spacing: "3px"
                    - color: "#00ff80"
                    - font-weight: "700"
                  label:
                    - font-size: "9px"
                    - letter-spacing: "2px"
                    - color: "rgba(0,255,128,0.55)"
                    - text-transform: "uppercase"
                  icon:
                    - color: "#00ff80"
                    - width: "34px"
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_brew_start

              - type: custom:button-card
                entity: button.philips_barista_brew_brew_stop
                name: BREW
                label: STOP
                show_label: true
                icon: mdi:stop-circle
                styles:
                  card:
                    - height: "90px"
                    - background: "linear-gradient(135deg, rgba(60,0,0,0.85), rgba(100,0,0,0.35))"
                    - border: "1px solid rgba(255,60,60,0.45)"
                    - box-shadow: "0 0 18px rgba(255,60,60,0.15), 0 4px 12px rgba(0,0,0,0.4)"
                    - border-radius: "14px"
                  name:
                    - font-size: "17px"
                    - letter-spacing: "3px"
                    - color: "#ff4444"
                    - font-weight: "700"
                  label:
                    - font-size: "9px"
                    - letter-spacing: "2px"
                    - color: "rgba(255,60,60,0.55)"
                    - text-transform: "uppercase"
                  icon:
                    - color: "#ff4444"
                    - width: "34px"
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_brew_stop

          # STEAM buttons
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: button.philips_barista_brew_steam_start
                name: STEAM
                label: START
                show_label: true
                icon: mdi:play-circle-outline
                styles:
                  card:
                    - height: "90px"
                    - background: "linear-gradient(135deg, rgba(0,30,60,0.85), rgba(0,60,120,0.35))"
                    - border: "1px solid rgba(0,160,255,0.45)"
                    - box-shadow: "0 0 18px rgba(0,160,255,0.15), 0 4px 12px rgba(0,0,0,0.4)"
                    - border-radius: "14px"
                  name:
                    - font-size: "17px"
                    - letter-spacing: "3px"
                    - color: "#00aaff"
                    - font-weight: "700"
                  label:
                    - font-size: "9px"
                    - letter-spacing: "2px"
                    - color: "rgba(0,160,255,0.55)"
                    - text-transform: "uppercase"
                  icon:
                    - color: "#00aaff"
                    - width: "34px"
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_steam_start

              - type: custom:button-card
                entity: button.philips_barista_brew_steam_stop
                name: STEAM
                label: STOP
                show_label: true
                icon: mdi:stop-circle-outline
                styles:
                  card:
                    - height: "90px"
                    - background: "linear-gradient(135deg, rgba(50,25,0,0.85), rgba(100,50,0,0.35))"
                    - border: "1px solid rgba(255,160,0,0.45)"
                    - box-shadow: "0 0 18px rgba(255,160,0,0.15), 0 4px 12px rgba(0,0,0,0.4)"
                    - border-radius: "14px"
                  name:
                    - font-size: "17px"
                    - letter-spacing: "3px"
                    - color: "#ff9900"
                    - font-weight: "700"
                  label:
                    - font-size: "9px"
                    - letter-spacing: "2px"
                    - color: "rgba(255,160,0,0.55)"
                    - text-transform: "uppercase"
                  icon:
                    - color: "#ff9900"
                    - width: "34px"
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_steam_stop

          # GRINDER button
          - type: custom:button-card
            entity: button.philips_barista_brew_grinder
            name: GRINDER
            label: ONE-SHOT GRIND
            show_label: true
            icon: mdi:screw-machine-round-top
            styles:
              card:
                - height: "75px"
                - background: "linear-gradient(135deg, rgba(40,20,0,0.85), rgba(80,40,0,0.35))"
                - border: "1px solid rgba(200,120,0,0.45)"
                - box-shadow: "0 0 15px rgba(200,120,0,0.12), 0 4px 12px rgba(0,0,0,0.4)"
                - border-radius: "14px"
              name:
                - font-size: "15px"
                - letter-spacing: "3px"
                - color: "#cc8800"
                - font-weight: "700"
              label:
                - font-size: "9px"
                - letter-spacing: "2px"
                - color: "rgba(200,120,0,0.55)"
                - text-transform: "uppercase"
              icon:
                - color: "#cc8800"
                - width: "30px"
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_grinder

          # Grind time number
          - type: custom:mushroom-number-card
            entity: number.philips_barista_brew_grind_time
            name: Grind Time (ms)
            display_mode: buttons
            icon: mdi:timer-outline

      # -----------------------------------------------------------------------
      # COLUMN 2 — LIVE SENSORS + ADJUSTABLE SETTINGS
      # -----------------------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-column: "2"
        cards:

          # Temperature big display
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.philips_barista_brew_thermoblock_temperature') | round(1) }} °C
            secondary: Thermoblock Temperature
            icon: mdi:thermometer
            icon_color: >-
              {% set t = states('sensor.philips_barista_brew_thermoblock_temperature') | float(0) %}
              {% if t >= 125 %} red
              {% elif t >= 85 %} amber
              {% else %} blue
              {% endif %}
            badge_icon: >-
              {% set mode = states('text_sensor.philips_barista_brew_machine_mode') %}
              {% if mode == 'brewing' %} mdi:coffee
              {% elif mode == 'steaming' %} mdi:waves
              {% else %} mdi:check-circle
              {% endif %}
            badge_color: >-
              {% set mode = states('text_sensor.philips_barista_brew_machine_mode') %}
              {% if mode == 'brewing' %} amber
              {% elif mode == 'steaming' %} blue
              {% else %} green
              {% endif %}
            tap_action:
              action: more-info

          # Brew temperature setpoint
          - type: custom:mushroom-number-card
            entity: number.philips_barista_brew_brew_temperature
            name: Brew Temperature Target (°C)
            display_mode: buttons
            icon: mdi:thermometer-chevron-up

          # Flow max setpoint
          - type: custom:mushroom-number-card
            entity: number.philips_barista_brew_brew_flow_max
            name: Shot Volume Target (mL)
            display_mode: buttons
            icon: mdi:cup-water

          # Live flow sensors
          - type: glance
            title: Live Brew Sensors
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.philips_barista_brew_brew_flow_rate
                name: Flow Rate
                icon: mdi:water-pump
              - entity: sensor.philips_barista_brew_brew_flow_total
                name: Volume
                icon: mdi:water
              - entity: sensor.philips_barista_brew_thermoblock_temperature
                name: Temp °C
                icon: mdi:thermometer

          # Last shot glance
          - type: glance
            title: Last Shot
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.philips_barista_brew_last_shot_duration
                name: Duration (s)
                icon: mdi:timer
              - entity: sensor.philips_barista_brew_last_shot_yield
                name: Yield (mL)
                icon: mdi:cup
              - entity: sensor.philips_barista_brew_last_shot_volume
                name: Volume (mL)
                icon: mdi:water-outline

          # Maintenance buttons
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Autotune PID
                secondary: Calibrate heater
                icon: mdi:tune-variant
                icon_color: purple
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_pid_autotune
              - type: custom:mushroom-template-card
                primary: Restart
                secondary: ESP32
                icon: mdi:restart
                icon_color: grey
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_restart

      # -----------------------------------------------------------------------
      # COLUMN 3 — LIVE GRAPHS
      # -----------------------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-column: "3"
        cards:

          # Heater climate card
          - type: custom:mushroom-climate-card
            entity: climate.philips_barista_brew_main_heater
            name: PID Heater
            show_temperature_control: true
            hvac_modes:
              - heat
              - "off"

          # Temperature live graph — 30-minute window
          - type: custom:mini-graph-card
            name: Thermoblock — Live (30 min)
            icon: mdi:thermometer
            entities:
              - entity: sensor.philips_barista_brew_thermoblock_temperature
                name: Temperature
                color: "#e74c3c"
            hours_to_show: 0.5
            points_per_hour: 120
            line_width: 2
            animate: true
            show:
              labels: true
              points: false
              fill: true
            color_thresholds:
              - value: 80
                color: "#27ae60"
              - value: 100
                color: "#f39c12"
              - value: 130
                color: "#e74c3c"

          # Flow live graph — 5-minute window
          - type: custom:mini-graph-card
            name: Shot Flow — Live (5 min)
            icon: mdi:water-pump
            entities:
              - entity: sensor.philips_barista_brew_brew_flow_rate
                name: Flow Rate (mL/s)
                color: "#3498db"
              - entity: sensor.philips_barista_brew_brew_flow_total
                name: Volume (mL)
                color: "#2ecc71"
                y_axis: secondary
            hours_to_show: 0.083
            points_per_hour: 720
            line_width: 2
            animate: true
            show:
              labels: true
              points: false
              legend: true
              fill: false

  # ===========================================================================
  # VIEW 2 — SIMULATION (Mock Hardware)
  # Two-column layout:
  #   Column 1 (left) : Mock status + action buttons + puck presets
  #   Column 2 (right): Live mock graphs + physics tuning parameters
  # ===========================================================================
  - title: Simulation
    icon: mdi:flask
    path: simulation
    type: custom:grid-layout
    layout:
      grid-template-columns: "1fr 1fr"
      grid-gap: "12px 12px"
      padding: "8px"
      mediaquery:
        "(max-width: 700px)":
          grid-template-columns: "1fr"
    cards:

      # -----------------------------------------------------------------------
      # COLUMN 1 — MOCK CONTROLS
      # -----------------------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-column: "1"
        cards:

          # Simulation mode chips
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:flask
                icon_color: purple
                content: "SIMULATION MODE"
                tap_action:
                  action: none
              - type: template
                icon: mdi:coffee-maker-check
                icon_color: >-
                  {% set mode = states('text_sensor.philips_barista_brew_mock_machine_mode') %}
                  {% if mode == 'brewing' %} amber
                  {% elif mode == 'steaming' %} blue
                  {% else %} green
                  {% endif %}
                content: >-
                  {% set mode = states('text_sensor.philips_barista_brew_mock_machine_mode') | upper %}
                  {{ mode if mode not in ('UNKNOWN','UNAVAILABLE') else 'OFFLINE' }}
                tap_action:
                  action: none
              - type: template
                icon: mdi:thermometer
                icon_color: >-
                  {% set t = states('sensor.philips_barista_brew_mock_thermoblock_temperature') | float(0) %}
                  {% if t >= 125 %} red
                  {% elif t >= 85 %} amber
                  {% else %} blue
                  {% endif %}
                content: >-
                  {{ states('sensor.philips_barista_brew_mock_thermoblock_temperature') | round(1) }} °C
                tap_action:
                  action: none

          # Mock power switch
          - type: custom:mushroom-entity-card
            entity: switch.philips_barista_brew_mock_espresso_machine_power
            name: Simulation Power
            icon: mdi:power
            icon_color: purple

          # Mock brew buttons
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: button.philips_barista_brew_mock_brew_start
                name: BREW
                label: START
                show_label: true
                icon: mdi:play-circle
                styles:
                  card:
                    - height: "90px"
                    - background: "linear-gradient(135deg, rgba(30,0,40,0.85), rgba(60,0,80,0.35))"
                    - border: "1px solid rgba(180,0,255,0.45)"
                    - box-shadow: "0 0 18px rgba(180,0,255,0.15), 0 4px 12px rgba(0,0,0,0.4)"
                    - border-radius: "14px"
                  name:
                    - font-size: "17px"
                    - letter-spacing: "3px"
                    - color: "#cc44ff"
                    - font-weight: "700"
                  label:
                    - font-size: "9px"
                    - letter-spacing: "2px"
                    - color: "rgba(180,0,255,0.55)"
                    - text-transform: "uppercase"
                  icon:
                    - color: "#cc44ff"
                    - width: "34px"
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_brew_start

              - type: custom:button-card
                entity: button.philips_barista_brew_mock_brew_stop
                name: BREW
                label: STOP
                show_label: true
                icon: mdi:stop-circle
                styles:
                  card:
                    - height: "90px"
                    - background: "linear-gradient(135deg, rgba(60,0,0,0.85), rgba(100,0,0,0.35))"
                    - border: "1px solid rgba(255,60,60,0.45)"
                    - box-shadow: "0 0 18px rgba(255,60,60,0.15), 0 4px 12px rgba(0,0,0,0.4)"
                    - border-radius: "14px"
                  name:
                    - font-size: "17px"
                    - letter-spacing: "3px"
                    - color: "#ff4444"
                    - font-weight: "700"
                  label:
                    - font-size: "9px"
                    - letter-spacing: "2px"
                    - color: "rgba(255,60,60,0.55)"
                    - text-transform: "uppercase"
                  icon:
                    - color: "#ff4444"
                    - width: "34px"
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_brew_stop

          # Mock steam buttons
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: button.philips_barista_brew_mock_steam_start
                name: STEAM
                label: START
                show_label: true
                icon: mdi:play-circle-outline
                styles:
                  card:
                    - height: "90px"
                    - background: "linear-gradient(135deg, rgba(0,20,50,0.85), rgba(0,40,100,0.35))"
                    - border: "1px solid rgba(0,120,255,0.45)"
                    - box-shadow: "0 0 18px rgba(0,120,255,0.15), 0 4px 12px rgba(0,0,0,0.4)"
                    - border-radius: "14px"
                  name:
                    - font-size: "17px"
                    - letter-spacing: "3px"
                    - color: "#3399ff"
                    - font-weight: "700"
                  label:
                    - font-size: "9px"
                    - letter-spacing: "2px"
                    - color: "rgba(0,120,255,0.55)"
                    - text-transform: "uppercase"
                  icon:
                    - color: "#3399ff"
                    - width: "34px"
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_steam_start

              - type: custom:button-card
                entity: button.philips_barista_brew_mock_steam_stop
                name: STEAM
                label: STOP
                show_label: true
                icon: mdi:stop-circle-outline
                styles:
                  card:
                    - height: "90px"
                    - background: "linear-gradient(135deg, rgba(50,25,0,0.85), rgba(100,50,0,0.35))"
                    - border: "1px solid rgba(255,160,0,0.45)"
                    - box-shadow: "0 0 18px rgba(255,160,0,0.15), 0 4px 12px rgba(0,0,0,0.4)"
                    - border-radius: "14px"
                  name:
                    - font-size: "17px"
                    - letter-spacing: "3px"
                    - color: "#ff9900"
                    - font-weight: "700"
                  label:
                    - font-size: "9px"
                    - letter-spacing: "2px"
                    - color: "rgba(255,160,0,0.55)"
                    - text-transform: "uppercase"
                  icon:
                    - color: "#ff9900"
                    - width: "34px"
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_steam_stop

          # Puck density presets (mock-only)
          - type: markdown
            content: >
              **☕ Puck Density Presets** — simulates different coffee puck resistance
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Open
                secondary: D=1 (0 bar)
                icon: mdi:coffee-outline
                icon_color: teal
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_puck_open_d_1
              - type: custom:mushroom-template-card
                primary: Soft
                secondary: D=25 (3.6 bar)
                icon: mdi:coffee
                icon_color: green
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_puck_soft_d_25
              - type: custom:mushroom-template-card
                primary: Medium
                secondary: D=50 (7.4 bar)
                icon: mdi:coffee-maker
                icon_color: amber
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_puck_medium_d_50

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Hard
                secondary: D=75 (11 bar)
                icon: mdi:coffee-maker-check
                icon_color: orange
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_puck_hard_d_75
              - type: custom:mushroom-template-card
                primary: Blocked
                secondary: D=100 (15 bar)
                icon: mdi:cancel
                icon_color: red
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_puck_blocked_d_100

          # Puck density live number
          - type: custom:mushroom-number-card
            entity: number.philips_barista_brew_mock_mock_puck_density
            name: Puck Density (1=open, 100=blocked)
            display_mode: buttons
            icon: mdi:coffee

          # Mock reset + grinder
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Reset Flow
                secondary: Clear volume
                icon: mdi:restart
                icon_color: grey
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_reset_flow
              - type: custom:mushroom-template-card
                primary: Grinder
                secondary: One-shot
                icon: mdi:screw-machine-round-top
                icon_color: brown
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_grinder

      # -----------------------------------------------------------------------
      # COLUMN 2 — MOCK LIVE DATA + PHYSICS TUNING
      # -----------------------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-column: "2"
        cards:

          # Mock temperature live graph with SSR duty overlay
          - type: custom:mini-graph-card
            name: Thermoblock + SSR Duty (Simulated)
            icon: mdi:thermometer
            entities:
              - entity: sensor.philips_barista_brew_mock_thermoblock_temperature
                name: Temperature (°C)
                color: "#e74c3c"
              - entity: sensor.philips_barista_brew_mock_heater_ssr_duty
                name: SSR Duty (%)
                color: "#f39c12"
                y_axis: secondary
            hours_to_show: 0.25
            points_per_hour: 240
            line_width: 2
            animate: true
            show:
              labels: true
              points: false
              fill: false
              legend: true
            color_thresholds:
              - value: 80
                color: "#27ae60"
              - value: 100
                color: "#f39c12"
              - value: 130
                color: "#e74c3c"

          # Mock flow + pressure live graph
          - type: custom:mini-graph-card
            name: Flow Rate + Pressure (Simulated)
            icon: mdi:water-pump
            entities:
              - entity: sensor.philips_barista_brew_mock_brew_flow_rate
                name: Flow Rate (mL/s)
                color: "#3498db"
              - entity: sensor.philips_barista_brew_mock_brew_flow_total
                name: Volume (mL)
                color: "#2ecc71"
                y_axis: secondary
              - entity: sensor.philips_barista_brew_mock_mock_brew_pump_pressure
                name: Pressure (bar)
                color: "#e67e22"
                y_axis: secondary
            hours_to_show: 0.083
            points_per_hour: 720
            line_width: 2
            animate: true
            show:
              labels: true
              points: false
              legend: true
              fill: false

          # Nozzle flow sensors (mock-specific output side)
          - type: glance
            title: Nozzle Output (Group Head)
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.philips_barista_brew_mock_nozzle_flow_rate
                name: Rate (mL/s)
                icon: mdi:water-boiler
              - entity: sensor.philips_barista_brew_mock_nozzle_flow_total
                name: Total (mL)
                icon: mdi:cup
              - entity: sensor.philips_barista_brew_mock_mock_brew_pump_pressure
                name: Pressure (bar)
                icon: mdi:gauge

          # Thermal physics parameters
          - type: entities
            title: 🔥 Thermal Model
            entities:
              - entity: number.philips_barista_brew_mock_mock_heater_power
                name: Heater Power (W)
                icon: mdi:lightning-bolt
              - entity: number.philips_barista_brew_mock_mock_thermal_mass
                name: Thermal Mass (J/°C)
                icon: mdi:weight
              - entity: number.philips_barista_brew_mock_mock_heat_loss
                name: Heat Loss (W/°C)
                icon: mdi:fire
              - entity: number.philips_barista_brew_mock_mock_ambient_temperature
                name: Ambient Temperature (°C)
                icon: mdi:home-thermometer

          # Pump / flow physics parameters
          - type: entities
            title: 💧 Pump + Puck Model
            entities:
              - entity: number.philips_barista_brew_mock_mock_nominal_flow
                name: Nominal Flow (mL/s @ 9 bar)
                icon: mdi:water-pump
              - entity: number.philips_barista_brew_mock_mock_pump_max_pressure
                name: Pump Max Pressure (bar)
                icon: mdi:gauge
              - entity: number.philips_barista_brew_mock_mock_puck_time_constant
                name: Puck Time Constant (s)
                icon: mdi:timer-sand
              - entity: number.philips_barista_brew_mock_mock_internal_volume
                name: Internal Volume (mL)
                icon: mdi:pipe

          # Mock heater climate
          - type: custom:mushroom-climate-card
            entity: climate.philips_barista_brew_mock_espresso_heater
            name: Heater (Simulated)
            show_temperature_control: true
            hvac_modes:
              - heat
              - "off"

          # Mock maintenance
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Autotune PID
                secondary: Simulate autotune
                icon: mdi:tune-variant
                icon_color: purple
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_pid_autotune
              - type: custom:mushroom-template-card
                primary: Restart
                secondary: ESP32 (Sim)
                icon: mdi:restart
                icon_color: grey
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.philips_barista_brew_mock_restart

  # ===========================================================================
  # VIEW 3 — SHOT HISTORY + ANALYTICS
  # Requires AppDaemon + helpers — see CUSTOM_UI.md
  # ===========================================================================
  - title: Shot History
    icon: mdi:chart-timeline-variant
    path: history
    cards:

      # Shot count chip
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:counter
            icon_color: purple
            content: "{{ states('sensor.espresso_shot_count') }} shots recorded"
            tap_action:
              action: none

      # Scrollable shot log table
      - type: markdown
        title: Shot Log
        content: >-
          {% set log = states('input_text.espresso_shot_log') %}
          {% if log in ('unknown','unavailable','[]','') %}
          _No shots recorded yet. Pull an espresso to start your history!_
          {% else %}
          {% set shots = log | from_json | reverse | list %}
          | # | Date | Duration | Yield | Temp |
          |---|------|----------|-------|------|
          {% for s in shots %}
          | {{ s.number }} | {{ as_datetime(s.start) | as_local | strftime('%m/%d %H:%M') }} | {{ s.duration_s | round(0) }}s | {{ s.yield_ml | round(1) }} mL | {{ s.temp_c | round(1) }} °C |
          {% endfor %}
          {% endif %}

      # Shot selector
      - type: entities
        title: Inspect a Shot
        entities:
          - entity: input_select.espresso_shot_viewer
            name: Select Shot
            icon: mdi:magnify

      # Temperature during selected shot
      - type: custom:apexcharts-card
        header:
          show: true
          title: Temperature — Selected Shot
          show_states: true
          colorize_states: true
        graph_span: "{{ states('sensor.espresso_selected_shot_span_sec') | int(180) }}sec"
        span:
          end: "{{ states('sensor.espresso_selected_shot_end_offset') }}"
        series:
          - entity: sensor.philips_barista_brew_thermoblock_temperature
            name: Thermoblock (°C)
            color: "#e74c3c"
            stroke_width: 2
            fill_raw: "last"
            type: line
        yaxis:
          - id: temp
            min: 50
            max: 140
            decimals: 1
        apex_config:
          chart:
            animations:
              enabled: false
          stroke:
            curve: smooth

      # Flow rate during selected shot
      - type: custom:apexcharts-card
        header:
          show: true
          title: Flow Rate — Selected Shot
          show_states: true
          colorize_states: true
        graph_span: "{{ states('sensor.espresso_selected_shot_span_sec') | int(180) }}sec"
        span:
          end: "{{ states('sensor.espresso_selected_shot_end_offset') }}"
        series:
          - entity: sensor.philips_barista_brew_brew_flow_rate
            name: Flow Rate (mL/s)
            color: "#3498db"
            stroke_width: 2
            fill_raw: "last"
            type: area
          - entity: sensor.philips_barista_brew_brew_flow_total
            name: Volume (mL)
            color: "#2ecc71"
            stroke_width: 2
            fill_raw: "last"
            type: line
        apex_config:
          chart:
            animations:
              enabled: false
          stroke:
            curve: stepline

      # Temperature — last 2 hours (context view)
      - type: history-graph
        title: Temperature — Last 2 Hours
        entities:
          - entity: sensor.philips_barista_brew_thermoblock_temperature
            name: Temperature
        hours_to_show: 2
        refresh_interval: 30

  # ===========================================================================
  # VIEW 4 — ADVANCED / DIAGNOSTICS
  # Direct hardware control — for debugging and maintenance only
  # ===========================================================================
  - title: Advanced
    icon: mdi:wrench
    path: advanced
    cards:

      # Diagnostic chips — uptime, Wi-Fi, ESP32 temp
      - type: glance
        title: System Diagnostics
        entities:
          - entity: sensor.philips_barista_brew_uptime
            name: Uptime
            icon: mdi:clock
          - entity: sensor.philips_barista_brew_wi_fi_signal
            name: Wi-Fi (dBm)
            icon: mdi:wifi
          - entity: sensor.philips_barista_brew_esp32_temperature
            name: ESP32 (°C)
            icon: mdi:chip

      # Direct valve control (diagnostic — normally managed by orchestrator)
      - type: entities
        title: Valves — Direct Control
        entities:
          - entity: switch.philips_barista_brew_brew_valve
            name: Brew Valve
            icon: mdi:valve
          - entity: switch.philips_barista_brew_steam_valve
            name: Steam Valve
            icon: mdi:valve
          - entity: switch.philips_barista_brew_purge_valve
            name: Purge / Drain Valve
            icon: mdi:valve

      # Pump direct control (diagnostic)
      - type: entities
        title: Pump — Direct Control
        entities:
          - entity: switch.philips_barista_brew_vibration_pump
            name: Vibration Pump
            icon: mdi:pump

      # 24-hour temperature history
      - type: custom:mini-graph-card
        name: Temperature — Last 24 Hours
        entities:
          - entity: sensor.philips_barista_brew_thermoblock_temperature
            name: Thermoblock
        hours_to_show: 24
        points_per_hour: 60
        line_width: 1
        show:
          labels: true
          points: false
          fill: true

      # Mock diagnostics — valves + pump (only visible when mock device is present)
      - type: entities
        title: Simulation — Valves Direct Control
        entities:
          - entity: switch.philips_barista_brew_mock_brew_valve
            name: Brew Valve (Sim)
            icon: mdi:valve
          - entity: switch.philips_barista_brew_mock_steam_valve
            name: Steam Valve (Sim)
            icon: mdi:valve
          - entity: switch.philips_barista_brew_mock_purge_valve
            name: Purge Valve (Sim)
            icon: mdi:valve

      - type: glance
        title: Simulation — System Diagnostics
        entities:
          - entity: sensor.philips_barista_brew_mock_uptime
            name: Uptime
            icon: mdi:clock
          - entity: sensor.philips_barista_brew_mock_wi_fi_signal
            name: Wi-Fi (dBm)
            icon: mdi:wifi
          - entity: sensor.philips_barista_brew_mock_esp32_temperature
            name: ESP32 (°C)
            icon: mdi:chip

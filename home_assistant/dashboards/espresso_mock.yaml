# =============================================================================
# Lovelace Dashboard — Espresso Machine (Mock / Simulation Mode)
# Target device: philips_barista_brew_mock.yaml
# =============================================================================
#
# HOW TO ADD THIS DASHBOARD TO HOME ASSISTANT
# -------------------------------------------
# Option A — UI Editor:
#   Settings → Dashboards → Add Dashboard → "Empty dashboard"
#   Name it "Espresso Sim" → Edit → Raw configuration editor → paste YAML.
#
# Option B — File-based:
#   Add to lovelace_dashboards: in configuration.yaml:
#     espresso_mock:
#       mode: yaml
#       filename: espresso_mock_dashboard.yaml
#       title: "Espresso Sim"
#       icon: mdi:flask
#
# REQUIRED HACS CUSTOM CARDS (same as real dashboard):
#   1. mushroom        — https://github.com/piitaya/lovelace-mushroom
#   2. mini-graph-card — https://github.com/kalkih/mini-graph-card
#   3. apexcharts-card — https://github.com/RomRider/apexcharts-card
#
# ENTITY PREFIXES
# ---------------
# All entities below use the prefix: philips_barista_brew_mock
# This dashboard is the counterpart of espresso_real.yaml but targets the mock
# simulation device and adds the Physics Tuning view for adjusting the
# thermal and pump simulation parameters at runtime.
#
# SHOT HISTORY SETUP
# ------------------
# The shot history section requires the AppDaemon app configured for mock
# entities — see home_assistant/appdaemon/apps.yaml (mock block).
# =============================================================================

title: ☕ Espresso Sim
views:
  # ===========================================================================
  # VIEW 1 — Control (identical layout to real dashboard)
  # ===========================================================================
  - title: Control
    icon: mdi:coffee-maker
    path: control
    cards:

      # -----------------------------------------------------------------------
      # STATUS HEADER
      # -----------------------------------------------------------------------
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:flask
            icon_color: purple
            content: "SIMULATION MODE"
            tap_action:
              action: none
          - type: template
            icon: mdi:coffee-maker-check
            icon_color: >-
              {% set mode = states('text_sensor.philips_barista_brew_mock_machine_mode') %}
              {% if mode == 'brewing' %} amber
              {% elif mode == 'steaming' %} blue
              {% else %} green
              {% endif %}
            content: >-
              {% set mode = states('text_sensor.philips_barista_brew_mock_machine_mode') | upper %}
              {{ mode if mode not in ('UNKNOWN','UNAVAILABLE') else 'OFFLINE' }}
            tap_action:
              action: none
          - type: template
            icon: mdi:thermometer
            icon_color: >-
              {% set t = states('sensor.philips_barista_brew_mock_thermoblock_temperature') | float(0) %}
              {% if t >= 125 %} red
              {% elif t >= 85 %} amber
              {% else %} blue
              {% endif %}
            content: >-
              {{ states('sensor.philips_barista_brew_mock_thermoblock_temperature') | round(1) }} °C
            tap_action:
              action: none
          - type: template
            icon: mdi:water
            icon_color: teal
            content: >-
              {{ states('sensor.philips_barista_brew_mock_brew_flow_total') | round(1) }} mL
            tap_action:
              action: none

      # -----------------------------------------------------------------------
      # HEATER CLIMATE CARD
      # -----------------------------------------------------------------------
      - type: custom:mushroom-climate-card
        entity: climate.philips_barista_brew_mock_espresso_heater
        name: Heater (Simulated)
        show_temperature_control: true
        hvac_modes:
          - heat
          - "off"

      # -----------------------------------------------------------------------
      # TEMPERATURE LIVE GRAPH — includes SSR duty cycle
      # -----------------------------------------------------------------------
      - type: custom:mini-graph-card
        name: Thermoblock Temperature (Simulated)
        icon: mdi:thermometer
        entities:
          - entity: sensor.philips_barista_brew_mock_thermoblock_temperature
            name: Temperature (°C)
            color: "#e74c3c"
          - entity: sensor.philips_barista_brew_mock_heater_ssr_duty
            name: SSR Duty (%)
            color: "#f39c12"
            y_axis: secondary
        hours_to_show: 0.5
        points_per_hour: 120
        line_width: 2
        animate: true
        show:
          labels: true
          points: false
          fill: false
          legend: true
        color_thresholds:
          - value: 80
            color: "#27ae60"
          - value: 100
            color: "#f39c12"
          - value: 130
            color: "#e74c3c"

      # -----------------------------------------------------------------------
      # MAIN ACTION BUTTONS
      # -----------------------------------------------------------------------
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Brew
            secondary: Start
            icon: mdi:play-circle
            icon_color: green
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_mock_brew_start
            hold_action:
              action: none

          - type: custom:mushroom-template-card
            primary: Brew
            secondary: Stop
            icon: mdi:stop-circle
            icon_color: red
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_mock_brew_stop
            hold_action:
              action: none

          - type: custom:mushroom-template-card
            primary: Steam
            secondary: Start
            icon: mdi:play-circle-outline
            icon_color: blue
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_mock_steam_start
            hold_action:
              action: none

          - type: custom:mushroom-template-card
            primary: Steam
            secondary: Stop
            icon: mdi:stop-circle-outline
            icon_color: orange
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_mock_steam_stop
            hold_action:
              action: none

      # -----------------------------------------------------------------------
      # PUCK PRESET BUTTONS (mock-only)
      # -----------------------------------------------------------------------
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Easy
            secondary: 6 bar puck
            icon: mdi:coffee-outline
            icon_color: green
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_mock_puck_easy_6_bar
          - type: custom:mushroom-template-card
            primary: Nominal
            secondary: 9 bar puck
            icon: mdi:coffee
            icon_color: amber
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_mock_puck_nominal_9_bar
          - type: custom:mushroom-template-card
            primary: Hard
            secondary: 12 bar puck
            icon: mdi:coffee-maker
            icon_color: red
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_mock_puck_hard_12_bar

      # -----------------------------------------------------------------------
      # GRINDER CONTROLS
      # -----------------------------------------------------------------------
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Grinder
            secondary: One-shot grind
            icon: mdi:screw-machine-round-top
            icon_color: brown
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.philips_barista_brew_mock_grinder
          - type: custom:mushroom-number-card
            entity: number.philips_barista_brew_mock_grind_time
            name: Grind Time (ms)
            display_mode: buttons
            icon: mdi:timer-outline

      # -----------------------------------------------------------------------
      # BREW CONTROLS — adjustable settings exposed as HA entities
      # -----------------------------------------------------------------------
      - type: entities
        title: Brew Controls
        entities:
          - entity: switch.philips_barista_brew_mock_temperature_surfing
            name: Temperature Surfing
            icon: mdi:thermometer-lines
          - entity: number.philips_barista_brew_mock_brew_flow_max
            name: Flow Max (mL)
            icon: mdi:water

      # -----------------------------------------------------------------------
      # LIVE SHOT FLOW GRAPH
      # -----------------------------------------------------------------------
      - type: custom:mini-graph-card
        name: Live Shot Flow (Simulated)
        icon: mdi:water-pump
        entities:
          - entity: sensor.philips_barista_brew_mock_brew_flow_rate
            name: Flow Rate (mL/s)
            color: "#3498db"
          - entity: sensor.philips_barista_brew_mock_brew_flow_total
            name: Volume (mL)
            color: "#2ecc71"
            y_axis: secondary
          - entity: sensor.philips_barista_brew_mock_brew_pump_pressure
            name: Pressure (bar)
            color: "#e67e22"
            y_axis: secondary
        hours_to_show: 0.083
        points_per_hour: 720
        line_width: 2
        animate: true
        show:
          labels: true
          points: false
          legend: true
          fill: false

      # -----------------------------------------------------------------------
      # RESET FLOW BUTTON
      # -----------------------------------------------------------------------
      - type: custom:mushroom-template-card
        primary: Reset Flow
        secondary: Clear accumulated volume
        icon: mdi:restart
        icon_color: grey
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.philips_barista_brew_mock_reset_flow

      # -----------------------------------------------------------------------
      # LAST SHOT SUMMARY
      # -----------------------------------------------------------------------
      - type: glance
        title: Last Shot
        entities:
          - entity: sensor.philips_barista_brew_mock_last_shot_duration
            name: Duration (s)
            icon: mdi:timer
          - entity: sensor.philips_barista_brew_mock_last_shot_yield
            name: Yield (mL)
            icon: mdi:cup
          - entity: sensor.philips_barista_brew_mock_thermoblock_temperature
            name: Temp (°C)
            icon: mdi:thermometer

  # ===========================================================================
  # VIEW 2 — Shot History (identical logic to real dashboard)
  # ===========================================================================
  - title: Shot History
    icon: mdi:chart-timeline-variant
    path: history
    cards:

      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:counter
            icon_color: purple
            content: "{{ states('sensor.espresso_shot_count') }} shots recorded"
            tap_action:
              action: none

      - type: markdown
        title: Shot Log
        content: >-
          {% set log = states('input_text.espresso_shot_log') %}
          {% if log in ('unknown','unavailable','[]','') %}
          _No shots recorded yet. Pull a simulated espresso to start your history!_
          {% else %}
          {% set shots = log | from_json | reverse | list %}
          | # | Date | Duration | Yield | Temp |
          |---|------|----------|-------|------|
          {% for s in shots %}
          | {{ s.number }} | {{ as_datetime(s.start) | as_local | strftime('%m/%d %H:%M') }} | {{ s.duration_s | round(0) }}s | {{ s.yield_ml | round(1) }} mL | {{ s.temp_c | round(1) }} °C |
          {% endfor %}
          {% endif %}

      - type: entities
        title: Inspect a Shot
        entities:
          - entity: input_select.espresso_shot_viewer
            name: Select Shot
            icon: mdi:magnify

      - type: custom:apexcharts-card
        header:
          show: true
          title: Temperature — Selected Shot
          show_states: true
          colorize_states: true
        graph_span: "{{ states('sensor.espresso_selected_shot_span_sec') | int(180) }}sec"
        span:
          end: "{{ states('sensor.espresso_selected_shot_end_offset') }}"
        series:
          - entity: sensor.philips_barista_brew_mock_thermoblock_temperature
            name: Thermoblock (°C)
            color: "#e74c3c"
            stroke_width: 2
            fill_raw: "last"
            type: line
          - entity: sensor.philips_barista_brew_mock_heater_ssr_duty
            name: SSR Duty (%)
            color: "#f39c12"
            stroke_width: 1
            fill_raw: "last"
            type: line
        apex_config:
          chart:
            animations:
              enabled: false
          stroke:
            curve: smooth

      - type: custom:apexcharts-card
        header:
          show: true
          title: Flow Rate & Pressure — Selected Shot
          show_states: true
          colorize_states: true
        graph_span: "{{ states('sensor.espresso_selected_shot_span_sec') | int(180) }}sec"
        span:
          end: "{{ states('sensor.espresso_selected_shot_end_offset') }}"
        series:
          - entity: sensor.philips_barista_brew_mock_brew_flow_rate
            name: Flow Rate (mL/s)
            color: "#3498db"
            stroke_width: 2
            fill_raw: "last"
            type: area
          - entity: sensor.philips_barista_brew_mock_brew_flow_total
            name: Volume (mL)
            color: "#2ecc71"
            stroke_width: 2
            fill_raw: "last"
            type: line
          - entity: sensor.philips_barista_brew_mock_brew_pump_pressure
            name: Pressure (bar)
            color: "#e67e22"
            stroke_width: 2
            fill_raw: "last"
            type: line
        apex_config:
          chart:
            animations:
              enabled: false
          stroke:
            curve: stepline

      - type: history-graph
        title: Temperature — Last 2 Hours (context)
        entities:
          - entity: sensor.philips_barista_brew_mock_thermoblock_temperature
            name: Temperature
        hours_to_show: 2
        refresh_interval: 30

  # ===========================================================================
  # VIEW 3 — Physics Tuning (mock-only)
  # ===========================================================================
  - title: Physics Tuning
    icon: mdi:flask-outline
    path: physics
    cards:

      - type: markdown
        content: >-
          ## Mock Physics Parameters

          Adjust the thermal and pump simulation in real-time without reflashing.
          Changes take effect immediately and allow you to observe PID behaviour
          under different machine characteristics.

          > **Tip:** Hit "Brew Start" after changing puck pressure to compare
          > extraction curves at different resistance levels.

      # -----------------------------------------------------------------------
      # THERMAL PHYSICS
      # -----------------------------------------------------------------------
      - type: entities
        title: Thermal Model
        entities:
          - entity: number.philips_barista_brew_mock_mock_heater_power
            name: Heater Power (W)
            icon: mdi:lightning-bolt
          - entity: number.philips_barista_brew_mock_mock_thermal_mass
            name: Thermal Mass (J/°C)
            icon: mdi:weight
          - entity: number.philips_barista_brew_mock_mock_heat_loss
            name: Heat Loss (W/°C)
            icon: mdi:fire
          - entity: number.philips_barista_brew_mock_mock_ambient_temperature
            name: Ambient Temperature (°C)
            icon: mdi:home-thermometer

      # -----------------------------------------------------------------------
      # THERMAL PHYSICS GRAPH — heater power vs temperature rise
      # -----------------------------------------------------------------------
      - type: custom:mini-graph-card
        name: Temperature + SSR Duty
        entities:
          - entity: sensor.philips_barista_brew_mock_thermoblock_temperature
            name: Temperature (°C)
            color: "#e74c3c"
          - entity: sensor.philips_barista_brew_mock_heater_ssr_duty
            name: SSR Duty (%)
            color: "#f39c12"
            y_axis: secondary
        hours_to_show: 0.25
        points_per_hour: 240
        line_width: 2
        animate: true
        show:
          labels: true
          legend: true
          fill: false

      # -----------------------------------------------------------------------
      # PUMP / FLOW PHYSICS
      # -----------------------------------------------------------------------
      - type: entities
        title: Pump + Puck Model
        entities:
          - entity: number.philips_barista_brew_mock_mock_nominal_flow
            name: Nominal Flow (mL/s at 9 bar)
            icon: mdi:water-pump
          - entity: number.philips_barista_brew_mock_mock_pump_max_pressure
            name: Pump Max Pressure (bar)
            icon: mdi:gauge
          - entity: number.philips_barista_brew_mock_mock_puck_time_constant
            name: Puck Time Constant (s)
            icon: mdi:timer-sand
          - entity: number.philips_barista_brew_mock_mock_puck_pressure
            name: Puck Pressure (bar)
            icon: mdi:coffee

      # -----------------------------------------------------------------------
      # FLOW GRAPH — observe pump curve changes live
      # -----------------------------------------------------------------------
      - type: custom:mini-graph-card
        name: Flow Rate + Volume + Pressure
        entities:
          - entity: sensor.philips_barista_brew_mock_brew_flow_rate
            name: Flow Rate (mL/s)
            color: "#3498db"
          - entity: sensor.philips_barista_brew_mock_brew_flow_total
            name: Volume (mL)
            color: "#2ecc71"
            y_axis: secondary
          - entity: sensor.philips_barista_brew_mock_brew_pump_pressure
            name: Pressure (bar)
            color: "#e67e22"
            y_axis: secondary
        hours_to_show: 0.083
        points_per_hour: 720
        line_width: 2
        animate: true
        show:
          labels: true
          legend: true
          fill: false

      # -----------------------------------------------------------------------
      # PID AUTOTUNE
      # -----------------------------------------------------------------------
      - type: entities
        title: PID Tuning
        entities:
          - entity: button.philips_barista_brew_mock_pid_autotune
            name: Run PID Autotune
            icon: mdi:tune
          - entity: button.philips_barista_brew_mock_restart
            name: Restart ESP32 (Mock)
            icon: mdi:restart

  # ===========================================================================
  # VIEW 4 — Advanced / Diagnostics (same as real)
  # ===========================================================================
  - title: Advanced
    icon: mdi:wrench
    path: advanced
    cards:

      - type: entities
        title: Valves (Direct Control)
        entities:
          - entity: switch.philips_barista_brew_mock_brew_valve
            name: Brew Valve
            icon: mdi:valve
          - entity: switch.philips_barista_brew_mock_steam_valve
            name: Steam Valve
            icon: mdi:valve
          - entity: switch.philips_barista_brew_mock_purge_drain_valve
            name: Purge / Drain Valve
            icon: mdi:valve

      - type: glance
        title: Diagnostics
        entities:
          - entity: sensor.philips_barista_brew_mock_uptime
            name: Uptime
            icon: mdi:clock
          - entity: sensor.philips_barista_brew_mock_wi_fi_signal
            name: Wi-Fi (dBm)
            icon: mdi:wifi
          - entity: sensor.philips_barista_brew_mock_esp32_temperature
            name: ESP32 (°C)
            icon: mdi:chip

      - type: history-graph
        title: Temperature — Last 24 Hours
        entities:
          - entity: sensor.philips_barista_brew_mock_thermoblock_temperature
            name: Thermoblock
        hours_to_show: 24
        refresh_interval: 60

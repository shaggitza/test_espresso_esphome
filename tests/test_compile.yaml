# Test: actual ESPHome compile using the host platform (native Linux g++).
# This verifies C++ component code compiles end-to-end, not just schema.
# Uses integer pin numbers (GPIO abstraction is no-op on host).
# Also validates espresso_machine_heater (P1-1) and shot stat sensors (P1-5).
esphome:
  name: test-compile

host:

logger:

http_request:
  id: http_client

external_components:
  - source:
      type: local
      path: ../components
    components:
      - espresso_machine
      - espresso_machine_heater
      - espresso_machine_valve
      - espresso_machine_pump
      - espresso_machine_grinder
      - espresso_machine_flow_meter
      - espresso_machine_sprofiler

# --- Fake heater ---
sensor:
  - platform: template
    id: fake_thermoblock_temp
    lambda: "return 90.0f;"
    update_interval: 1s

output:
  - platform: slow_pwm
    id: fake_heater_ssr
    pin: 1
    period: 1s

climate:
  - platform: pid
    id: main_heater
    sensor: fake_thermoblock_temp
    heat_output: fake_heater_ssr
    default_target_temperature: 90
    control_parameters:
      kp: 0.5
      ki: 0.01
      kd: 1.0

# --- IHeater adapter (P1-1) ---
espresso_machine_heater:
  id: heater_ctrl
  climate_id: main_heater
  ssr_output: fake_heater_ssr     # enables runtime SSR period control from HA
  ssr_default_period_ms: 1000     # initial period published to HA on boot
  ssr_period_number:
    name: "SSR Period"

espresso_machine_flow_meter:
  id: brew_flow
  pin:
    number: 2
  pulses_per_ml: 0.5195
  rate_sensor:
    name: "Brew Flow Rate"
  total_sensor:
    name: "Brew Flow Total"

espresso_machine_valve:
  - id: brew_valve
    pin: 3
    normally_open: false
  - id: steam_valve
    pin: 4
    normally_open: false
  - id: purge_valve
    pin: 5
    normally_open: false

espresso_machine_pump:
  id: main_pump
  type: relay
  pin: 6
  flow_meter: brew_flow

espresso_machine_grinder:
  id: main_grinder
  type: relay
  pin: 7
  default_grind_time: 7s

espresso_machine:
  id: my_espresso
  brew:
    heater: main_heater
    heater_controller: heater_ctrl      # P1-2: wire IHeater adapter
    pump: main_pump
    valve: brew_valve
    purge_valve: purge_valve
    target_temperature: 90°C
    flow_max: 40ml
    flow_offset: 20ml
    shot_stats:                         # P1-5: shot stat sensor entities
      last_shot_time:
        name: "Last Shot Time"
      last_shot_volume:
        name: "Last Shot Volume"
      last_shot_yield:
        name: "Last Shot Yield"
  steam:
    heater: main_heater
    heater_controller: heater_ctrl      # P1-2: wire IHeater adapter for steam too
    pump: main_pump
    valve: steam_valve
    purge_valve: purge_valve
    target_temperature: 135°C
    flow_max: 2ml/s
    cool_down_to: 90°C

espresso_machine_sprofiler:
  id: sprofiler_upload
  http_request_id: http_client
  server: "https://sprofiler.io"
  api_token: "test_token_placeholder"
  profile_name: "Test Profile"
  espresso_machine: my_espresso

# Test: actual ESPHome compile using the host platform (native Linux g++).
# This verifies C++ component code compiles end-to-end, not just schema.
# Uses integer pin numbers (GPIO abstraction is no-op on host).
esphome:
  name: test-compile

host:

logger:

external_components:
  - source:
      type: local
      path: ../components
    components:
      - espresso_machine
      - espresso_machine_valve
      - espresso_machine_pump
      - espresso_machine_grinder
      - espresso_machine_flow_meter

# --- Fake heater ---
sensor:
  - platform: template
    id: fake_thermoblock_temp
    lambda: "return 90.0f;"
    update_interval: 1s

output:
  - platform: slow_pwm
    id: fake_heater_ssr
    pin: 1
    period: 1s

climate:
  - platform: pid
    id: main_heater
    sensor: fake_thermoblock_temp
    heat_output: fake_heater_ssr
    default_target_temperature: 90
    control_parameters:
      kp: 0.5
      ki: 0.01
      kd: 1.0

espresso_machine_flow_meter:
  id: brew_flow
  pin:
    number: 2
  pulses_per_ml: 0.5195
  rate_sensor:
    name: "Brew Flow Rate"
  total_sensor:
    name: "Brew Flow Total"

espresso_machine_valve:
  - id: brew_valve
    pin: 3
    normally_open: false
  - id: steam_valve
    pin: 4
    normally_open: false
  - id: purge_valve
    pin: 5
    normally_open: false

espresso_machine_pump:
  id: main_pump
  type: relay
  pin: 6

espresso_machine_grinder:
  id: main_grinder
  type: relay
  pin: 7
  default_grind_time: 7s

espresso_machine:
  id: my_espresso
  brew:
    heater: main_heater
    pump: main_pump
    flow_meter: brew_flow
    valve: brew_valve
    purge_valve: purge_valve
    target_temperature: 90°C
    flow_max: 40ml
    flow_offset: 20ml
  steam:
    heater: main_heater
    pump: main_pump
    valve: steam_valve
    purge_valve: purge_valve
    target_temperature: 135°C
    flow_max: 2ml/s
    cool_down_to: 90°C

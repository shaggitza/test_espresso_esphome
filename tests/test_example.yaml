# Test: validates the full example configuration (philips_barista_brew.yaml)
# using local components so CI catches schema regressions in the reference config.
# Covers all options used in the example: pre-infusion, temperature_profile,
# cleanup_script, flow_meter wired to the pump (not the orchestrator).
esphome:
  name: test-example

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components:
      - espresso_machine
      - espresso_machine_valve
      - espresso_machine_pump
      - espresso_machine_grinder
      - espresso_machine_flow_meter

# --- Temperature sensor (template replaces real MAX6675 for schema testing) ---
sensor:
  - platform: template
    id: thermoblock_temp
    lambda: "return 90.0f;"
    update_interval: 1s

# --- Heater SSR and PID climate ---
output:
  - platform: slow_pwm
    id: heater_ssr
    pin: GPIO4
    period: 1s

climate:
  - platform: pid
    id: main_heater
    name: "Espresso Heater"
    sensor: thermoblock_temp
    default_target_temperature: 90
    heat_output: heater_ssr
    control_parameters:
      kp: 2.5
      ki: 0.05
      kd: 15.0
    deadband_parameters:
      threshold_high: 0.3
      threshold_low: -0.3

# --- Flow meter ---
espresso_machine_flow_meter:
  id: brew_flow
  name: "Brew Flow"
  pin:
    number: GPIO34
    mode: INPUT
  pulses_per_ml: 0.5195

# --- Valves ---
espresso_machine_valve:
  - id: brew_valve
    name: "Brew Valve"
    pin: GPIO26
    normally_open: false
  - id: steam_valve
    name: "Steam Valve"
    pin: GPIO27
    normally_open: false
  - id: purge_valve
    name: "Purge / Drain Valve"
    pin: GPIO14
    normally_open: false

# --- Pump with flow_meter wired (pump owns the flow subsystem) ---
espresso_machine_pump:
  id: main_pump
  name: "Vibration Pump"
  type: relay
  pin: GPIO25
  flow_meter: brew_flow

# --- Grinder ---
espresso_machine_grinder:
  id: main_grinder
  name: "Grinder"
  type: relay
  pin: GPIO23
  default_grind_time: 7s

# --- Orchestrator: brew block has NO flow_meter key (owned by the pump) ---
espresso_machine:
  id: my_espresso
  brew:
    heater: main_heater
    pump: main_pump
    valve: brew_valve
    purge_valve: purge_valve
    target_temperature: 90°C
    temperature_profile:
      offset: 5°C
      ramp_time: 20s
    flow_max: 40ml
    flow_offset: 20ml
    pre_infusion:
      enabled: true
      volume_ml: 5ml
      hold_time: 5s
  steam:
    heater: main_heater
    pump: main_pump
    valve: steam_valve
    purge_valve: purge_valve
    target_temperature: 135°C
    flow_max: 2ml/s
    cool_down_to: 90°C

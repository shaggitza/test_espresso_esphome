# Test: validates the full example configuration (philips_barista_brew.yaml)
# using local components so CI catches schema regressions in the reference config.
# Covers all options used in the example: pre-infusion, temperature_profile,
# cleanup_script, flow_meter wired to the pump (not the orchestrator).
# Also validates espresso_machine_heater (P1-1), brew heater_controller (P1-2/P1-3),
# and shot_stats sensor entities (P1-5).
esphome:
  name: test-example

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components:
      - espresso_machine
      - espresso_machine_heater
      - espresso_machine_valve
      - espresso_machine_pump
      - espresso_machine_grinder
      - espresso_machine_flow_meter

# --- Temperature sensor (template replaces real MAX6675 for schema testing) ---
sensor:
  - platform: template
    id: thermoblock_temp
    lambda: "return 90.0f;"
    update_interval: 1s

# --- Heater SSR and PID climate ---
output:
  - platform: slow_pwm
    id: heater_ssr
    pin: GPIO4
    period: 1s

climate:
  - platform: pid
    id: main_heater
    name: "Espresso Heater"
    sensor: thermoblock_temp
    default_target_temperature: 90
    heat_output: heater_ssr
    control_parameters:
      kp: 0.55901
      ki: 0.11624
      kd: 0.67209
    deadband_parameters:
      threshold_high: 0.3
      threshold_low: -0.3

# --- IHeater adapter (P1-1) ---
espresso_machine_heater:
  id: heater_ctrl
  climate_id: main_heater

# --- Flow meter ---
espresso_machine_flow_meter:
  id: brew_flow
  name: "Brew Flow"
  pin:
    number: GPIO34
    mode: INPUT
  pulses_per_ml: 0.5195
  rate_sensor:
    name: "Brew Flow Rate"
  total_sensor:
    name: "Brew Flow Total"

# --- Valves ---
espresso_machine_valve:
  - id: brew_valve
    name: "Brew Valve"
    pin: GPIO26
    normally_open: false
  - id: steam_valve
    name: "Steam Valve"
    pin: GPIO27
    normally_open: false
  - id: purge_valve
    name: "Purge / Drain Valve"
    pin: GPIO14
    normally_open: false

# --- Pump with flow_meter wired (pump owns the flow subsystem) ---
espresso_machine_pump:
  id: main_pump
  name: "Vibration Pump"
  type: relay
  pin: GPIO25
  flow_meter: brew_flow

# --- Grinder ---
espresso_machine_grinder:
  id: main_grinder
  name: "Grinder"
  type: relay
  pin: GPIO23
  default_grind_time: 7s
  grind_time_number:
    name: "Grind Time"

# --- Buttons ---
button:
  - platform: restart
    name: "Restart"
  - platform: template
    name: "PID Autotune"
    on_press:
      - climate.pid.autotune: main_heater
  - platform: template
    name: "Brew Start"
    on_press:
      - lambda: id(my_espresso).brew_start();
  - platform: template
    name: "Brew Stop"
    on_press:
      - lambda: id(my_espresso).brew_stop();
  - platform: template
    name: "Steam Start"
    on_press:
      - lambda: id(my_espresso).steam_start();
  - platform: template
    name: "Steam Stop"
    on_press:
      - lambda: id(my_espresso).steam_stop();

# --- Machine mode text sensor ---
text_sensor:
  - platform: template
    name: "Machine Mode"
    id: machine_mode
    update_interval: 2s
    lambda: return std::string(id(my_espresso).mode_name());

espresso_machine:
  id: my_espresso
  brew:
    heater: main_heater
    heater_controller: heater_ctrl      # P1-2: wire IHeater adapter
    pump: main_pump
    valve: brew_valve
    purge_valve: purge_valve
    target_temperature: 90°C
    temperature_profile:
      offset: 5°C
      ramp_time: 20s
    flow_max: 40ml
    flow_max_number:
      name: "Brew Flow Max"
    flow_offset: 20ml
    pre_infusion:
      enabled: true
      volume_ml: 5ml
      hold_time: 5s
    shot_stats:                         # P1-5: native HA sensor entities
      last_shot_time:
        name: "Last Shot Duration"
      last_shot_volume:
        name: "Last Shot Volume"
      last_shot_yield:
        name: "Last Shot Yield"
  steam:
    heater: main_heater
    heater_controller: heater_ctrl      # P1-2: wire IHeater adapter for steam too
    pump: main_pump
    valve: steam_valve
    purge_valve: purge_valve
    target_temperature: 135°C
    flow_max: 2ml/s
    cool_down_to: 90°C

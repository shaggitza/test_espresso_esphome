# Test: validates the philips_barista_brew_mock.yaml example configuration.
# Mirrors the full mock example structure using local components so CI catches
# any schema regressions in the mock reference config.
# Covers: mock heater, mock pump, valves, grinder, orchestrator (brew + steam),
# shot_stats, puck preset buttons, and all runtime-tunable number entities.
esphome:
  name: test-philips-mock

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components:
      - espresso_machine
      - espresso_machine_heater
      - espresso_machine_valve
      - espresso_machine_grinder
      - espresso_machine_mock_heater
      - espresso_machine_mock_pump

# =============================================================================
# MOCK HEATER
# =============================================================================
espresso_machine_mock_heater:
  id: mock_heater
  initial_temperature: 25.0
  ambient_temperature: 25.0
  power_watts: 1200.0
  thermal_mass_j_per_c: 800.0
  heat_loss_w_per_c: 1.7
  water_inlet_temp_c: 20.0

  temperature_sensor:
    id: thermoblock_temp
    name: "Thermoblock Temperature"
    on_value_range:
      - above: 165
        then:
          - climate.control:
              id: main_heater
              mode: "off"

  output:
    id: heater_ssr

  power_number:
    name: "Mock Heater Power"
    entity_category: config
  thermal_mass_number:
    name: "Mock Thermal Mass"
    entity_category: config
  heat_loss_number:
    name: "Mock Heat Loss"
    entity_category: config
  ambient_number:
    name: "Mock Ambient Temperature"
    entity_category: config

  duty_sensor:
    name: "Heater SSR Duty"
    unit_of_measurement: "%"

# =============================================================================
# MOCK PUMP
# =============================================================================
espresso_machine_mock_pump:
  id: main_pump
  name: "Mock Pump"
  nominal_flow_ml_per_s: 4.0
  pump_max_pressure_bar: 15.0
  puck_time_constant_s: 10.0
  puck_density: 50
  internal_volume_ml: 20.0
  mock_heater: mock_heater

  rate_sensor:
    name: "Brew Flow Rate"
  total_sensor:
    name: "Brew Flow Total"
  pressure_sensor:
    name: "Brew Pump Pressure"

  nozzle_rate_sensor:
    name: "Nozzle Flow Rate"
  nozzle_total_sensor:
    name: "Nozzle Flow Total"

  nominal_flow_number:
    name: "Mock Nominal Flow"
    entity_category: config
  pump_max_pressure_number:
    name: "Mock Pump Max Pressure"
    entity_category: config
  puck_time_constant_number:
    name: "Mock Puck Time Constant"
    entity_category: config
  puck_density_number:
    id: main_pump_puck_density
    name: "Mock Puck Density"
    entity_category: config
  internal_volume_number:
    name: "Mock Internal Volume"
    entity_category: config

# =============================================================================
# ADDITIONAL SENSORS
# =============================================================================
sensor:
  - platform: internal_temperature
    name: "ESP32 Temperature"
    entity_category: diagnostic

# =============================================================================
# HEATER PID
# =============================================================================
climate:
  - platform: pid
    id: main_heater
    name: "Espresso Heater"
    sensor: thermoblock_temp
    default_target_temperature: 90
    heat_output: heater_ssr
    control_parameters:
      kp: 0.55901
      ki: 0.11624
      kd: 0.67209
      output_averaging_samples: 5
      derivative_averaging_samples: 5
    deadband_parameters:
      threshold_high: 0.3
      threshold_low: -0.3

# =============================================================================
# VALVES
# =============================================================================
espresso_machine_valve:
  - id: brew_valve
    name: "Brew Valve"
    pin: GPIO26
    normally_open: false

  - id: steam_valve
    name: "Steam Valve"
    pin: GPIO27
    normally_open: false

  - id: purge_valve
    name: "Purge / Drain Valve"
    pin: GPIO14
    normally_open: false

# =============================================================================
# GRINDER
# =============================================================================
espresso_machine_grinder:
  id: main_grinder
  name: "Grinder"
  type: relay
  pin: GPIO23
  default_grind_time: 7s
  grind_time_number:
    name: "Grind Time"
    entity_category: config

# =============================================================================
# ORCHESTRATOR
# =============================================================================
espresso_machine:
  id: my_espresso

  brew:
    heater: main_heater
    heater_controller: mock_heater
    pump: main_pump
    valve: brew_valve
    purge_valve: purge_valve
    temperature_profile:
      offset: 5°C
      ramp_time: 20s
    flow_max: 40ml
    flow_max_number:
      name: "Brew Flow Max"
    flow_offset: 20ml
    shot_stats:
      last_shot_time:
        name: "Last Shot Time"
      last_shot_volume:
        name: "Last Shot Volume"
      last_shot_yield:
        name: "Last Shot Yield"

  steam:
    heater: main_heater
    heater_controller: mock_heater
    pump: main_pump
    valve: steam_valve
    purge_valve: purge_valve
    target_temperature: 135°C
    purge_volume: 5ml
    flow_max: 2ml/s
    cool_down_to: 90°C
    timeout: 5min
    pump_min_on_time: 2s

# =============================================================================
# POWER SWITCH
# =============================================================================
switch:
  - platform: template
    id: machine_power
    name: "Espresso Machine Power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(my_espresso).machine_on();
      - climate.control:
          id: main_heater
          mode: heat
    turn_off_action:
      - lambda: id(my_espresso).machine_off();
      - climate.control:
          id: main_heater
          mode: "off"

# =============================================================================
# BUTTONS
# =============================================================================
button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "PID Autotune"
    entity_category: config
    on_press:
      - climate.pid.autotune: main_heater

  - platform: template
    name: "Brew Start"
    on_press:
      - lambda: id(my_espresso).brew_start();

  - platform: template
    name: "Brew Stop"
    on_press:
      - lambda: id(my_espresso).brew_stop();

  - platform: template
    name: "Steam Start"
    on_press:
      - lambda: id(my_espresso).steam_start();

  - platform: template
    name: "Steam Stop"
    on_press:
      - lambda: id(my_espresso).steam_stop();

  - platform: template
    name: "Reset Flow"
    entity_category: config
    on_press:
      - espresso_machine_mock_pump.reset: main_pump

  - platform: template
    name: "Puck: Open (D=1)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 1

  - platform: template
    name: "Puck: Soft (D=25)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 25

  - platform: template
    name: "Puck: Medium (D=50)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 50

  - platform: template
    name: "Puck: Hard (D=75)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 75

  - platform: template
    name: "Puck: Blocked (D=100)"
    entity_category: config
    on_press:
      - number.set:
          id: main_pump_puck_density
          value: 100

# =============================================================================
# NUMBER ENTITIES
# =============================================================================
number:
  - platform: template
    name: "Brew Temperature"
    id: brew_temp_number
    unit_of_measurement: "°C"
    min_value: 85
    max_value: 105
    step: 0.5
    initial_value: 90
    optimistic: true
    restore_value: true
    entity_category: config
    set_action:
      - climate.control:
          id: main_heater
          target_temperature: !lambda "return x;"

# =============================================================================
# TEXT SENSOR
# =============================================================================
text_sensor:
  - platform: template
    name: "Machine Mode"
    id: machine_mode
    update_interval: 2s
    entity_category: diagnostic
    lambda: return std::string(id(my_espresso).mode_name());

name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint component Python files
        run: flake8 components/ --max-line-length=100

  validate:
    name: ESPHome config — ${{ matrix.yaml }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        yaml:
          # Per-component minimal tests
          - tests/test_flow_meter.yaml
          - tests/test_valve.yaml
          - tests/test_pump.yaml
          - tests/test_grinder.yaml
          - tests/test_mock_heater.yaml
          - tests/test_mock_pump.yaml
          - tests/test_compile.yaml
          - tests/test_brewos.yaml
          # Full example configs (authoritative references)
          - examples/philips_barista_brew.yaml
          - examples/philips_barista_brew_mock.yaml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Prepare example config for CI
        if: startsWith(matrix.yaml, 'examples/')
        run: |
          # Generate a minimal secrets.yaml with a valid base64 API key
          python3 -c "
          import base64
          key = base64.b64encode(b'\x00' * 32).decode()
          open('examples/secrets.yaml', 'w').write(
              'wifi_ssid: CI_TEST\n'
              'wifi_password: CI_TEST_1\n'
              'ha_api_key: ' + key + '\n'
              'ota_password: CI_TEST\n'
          )
          "
          # Rewrite external_components source from github://main to local path
          # so the PR branch components are used instead of the merged-to-main copy.
          YAML="${{ matrix.yaml }}"
          CI_YAML="examples/ci_$(basename "$YAML")"
          sed 's|source: github://shaggitza/test_espresso_esphome@main|source:\n      type: local\n      path: ../components|' \
            "$YAML" > "$CI_YAML"

      - name: Validate ${{ matrix.yaml }}
        run: |
          YAML="${{ matrix.yaml }}"
          CI_YAML="examples/ci_$(basename "$YAML")"
          if [ -f "$CI_YAML" ]; then
            esphome config "$CI_YAML"
          else
            esphome config "$YAML"
          fi

  compile:
    name: ESPHome compile — host platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('tests/test_compile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile all components (host platform)
        run: esphome compile tests/test_compile.yaml

  addon-build:
    name: Build addon Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build espresso_shot_history addon image
        run: |
          docker build \
            --build-arg BUILD_FROM=python:3.12-alpine \
            addons/espresso_shot_history/

  cpp-test:
    name: C++ unit tests (GoogleTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build/cpp -S tests/cpp
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/cpp -j$(nproc)

      - name: Run tests
        run: ./build/cpp/all_tests --gtest_output=xml:build/cpp/test_results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-test-results
          path: build/cpp/test_results.xml

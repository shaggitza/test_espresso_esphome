name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint component Python files
        run: flake8 components/ --max-line-length=100

  validate:
    name: ESPHome config — ${{ matrix.yaml }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        yaml:
          # Per-component minimal tests
          - tests/test_flow_meter.yaml
          - tests/test_valve.yaml
          - tests/test_pump.yaml
          - tests/test_grinder.yaml
          - tests/test_mock_heater.yaml
          - tests/test_mock_pump.yaml
          - tests/test_compile.yaml
          # Full example configs (authoritative references)
          - examples/philips_barista_brew.yaml
          - examples/philips_barista_brew_mock.yaml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create mock secrets.yaml
        run: |
          cp secrets.yaml.example secrets.yaml
          cp secrets.yaml.example examples/secrets.yaml

      - name: Override github:// external_components source to local for CI
        run: |
          python3 -c "
          import re, sys
          path = sys.argv[1]
          text = open(path).read()
          text = re.sub(
              r'  - source: github://[^\n]+',
              '  - source:\n      type: local\n      path: components',
              text
          )
          open(path, 'w').write(text)
          " ${{ matrix.yaml }}

      - name: Validate ${{ matrix.yaml }}
        run: esphome config ${{ matrix.yaml }}

  compile:
    name: ESPHome compile — host platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('tests/test_compile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile all components (host platform)
        run: esphome compile tests/test_compile.yaml

  addon-build:
    name: Build addon Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build espresso_shot_history addon image
        run: |
          docker build \
            --build-arg BUILD_FROM=python:3.12-alpine \
            addons/espresso_shot_history/

  cpp-test:
    name: C++ unit tests (GoogleTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build/cpp -S tests/cpp
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/cpp -j$(nproc)

      - name: Run tests
        run: ./build/cpp/all_tests --gtest_output=xml:build/cpp/test_results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-test-results
          path: build/cpp/test_results.xml
